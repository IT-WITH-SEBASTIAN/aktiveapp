  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-top:1px solid var(--hairline);
  padding:10px 12px calc(14px + env(safe-area-inset-bottom)) 12px;
  display:grid; grid-template-columns:repeat(var(--nav-count, 5), 1fr);
  align-items:center;
}
@media (min-width:900px){ .bottom { position:absolute; border-bottom-left-radius:38px; border-bottom-right-radius:38px; } }
.bottom button.nav {
  border:0; background:transparent; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:600; cursor:pointer;
  padding:6px 4px; border-radius:10px;
  transition:color .15s;
  min-height:44px;
}
.bottom button.nav.active { color:var(--accent); }
.bottom button.nav svg { width:22px; height:22px; }

.fab {
  position:fixed; right:calc(50% - 215px + 18px); bottom:88px;
  z-index:60;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, #FF8A2F, #E86500);
  border:0; color:#111;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow: 0 10px 30px rgba(255,122,26,.35), 0 0 0 6px rgba(255,122,26,.08);
  cursor:pointer;
  transition:transform .15s var(--ease);
}
@media (max-width:900px){ .fab { right:18px; } }
.fab:active { transform:scale(.94); }
.fab svg { width:26px; height:26px; }

/* ---------- Buttons ---------- */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px; border-radius:12px; border:1px solid var(--hairline);
  background:var(--surface); color:var(--text); font-weight:700; font-size:13.5px;
  cursor:pointer; transition:transform .1s var(--ease), background .15s;
}
.btn:active { transform:scale(.98); }
.btn.primary {
  background:linear-gradient(135deg,#FF8A2F,#E86500); color:#111; border-color:transparent;
  box-shadow:0 8px 24px rgba(255,122,26,.28);
}
.btn.ghost { background:transparent; }
.btn.block { width:100%; }
.btn.danger { color:var(--danger); }

/* ---------- Detail ---------- */
.subhead {
  padding:12px 18px 6px;
  display:flex; align-items:center; gap:10px;
}
.subhead .back { cursor:pointer; }
.subhead h1 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em; }
.subhead .sub { color:var(--muted); font-size:12px; }

.gallery {
  position:relative; margin:8px 18px 0; border-radius:16px; overflow:hidden;
  background:#111;
  aspect-ratio:4/3;
}
.gallery .g-img { width:100%; height:100%; background-size:cover; background-position:center; }
.gallery .stat-strip {
  position:absolute; left:12px; right:12px; bottom:12px;
  background:rgba(11,11,13,.72); backdrop-filter:blur(14px);
  border:1px solid var(--hairline); border-radius:12px;
  display:grid; grid-template-columns:repeat(4,1fr);
  padding:10px;
}
.gallery .stat-strip div { text-align:center; }
.gallery .stat-strip .n { font-weight:800; font-size:15px; letter-spacing:-.01em; }
.gallery .stat-strip .l { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }

.detail-actions { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 18px 0; }
.detail-actions .btn { height:42px; padding:0; font-size:12px; flex-direction:column; gap:2px; }

.market-pill {
  margin:14px 18px 0; padding:10px 12px; border-radius:12px;
  background:rgba(78,168,255,.08); border:1px solid rgba(78,168,255,.25);
  color:var(--info); font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:8px;
}

/* ---------- Leads ---------- */
.lead-row {
  display:flex; gap:12px; align-items:center;
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--radius); padding:12px; margin:0 18px 8px;
  cursor:pointer;
}
.lead-row .dot { width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
.dot.hot { background:var(--danger); box-shadow:0 0 0 4px rgba(255,90,95,.15); }
.dot.warm { background:var(--accent); box-shadow:0 0 0 4px rgba(255,122,26,.15); }
.dot.cold { background:var(--info); box-shadow:0 0 0 4px rgba(78,168,255,.15); }
.lead-row .avt {
  width:40px; height:40px; border-radius:50%; background:var(--surface-2);
  display:inline-flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--muted); font-size:13px;
}
.lead-row .body { flex:1; min-width:0; }
.lead-row .name { font-size:13.5px; font-weight:700; }
.lead-row .veh { color:var(--muted); font-size:11.5px; margin-top:1px; }
.lead-row .msg { color:var(--text); opacity:.85; font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lead-row .side { text-align:right; color:var(--muted); font-size:11px; }
.lead-row .unread { display:inline-block; min-width:18px; padding:2px 6px; background:var(--accent); color:#111; border-radius:999px; font-size:10px; font-weight:800; margin-top:4px; }

/* ---------- Chat ---------- */
.chat-wrap { display:flex; flex-direction:column; height:100%; }
.chat-messages { flex:1; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.bubble { max-width:78%; padding:10px 12px; border-radius:14px; font-size:13.5px; line-height:1.4; }
.bubble.them { background:var(--surface-2); color:var(--text); border-top-left-radius:6px; align-self:flex-start; }
.bubble.me { background:linear-gradient(135deg,#FF8A2F,#E86500); color:#111; border-top-right-radius:6px; align-self:flex-end; font-weight:600; }
.bubble .time { display:block; font-size:10px; opacity:.6; margin-top:4px; font-weight:500; }
.quick-replies { display:flex; gap:6px; overflow-x:auto; padding:8px 14px; border-top:1px solid var(--hairline); }
.quick-replies::-webkit-scrollbar { display:none; }
.quick-replies .qr {
  flex:0 0 auto; padding:8px 12px; border-radius:999px;
  background:var(--surface); border:1px solid var(--hairline); font-size:12px; font-weight:600; cursor:pointer; color:var(--text);
}
.chat-input {
  display:flex; gap:8px; padding:10px 14px 14px; border-top:1px solid var(--hairline); background:var(--bg-elevated);
}
.chat-input input {
  flex:1; height:44px; border-radius:22px; border:1px solid var(--hairline);
  background:var(--surface-2); color:var(--text); padding:0 16px; font-size:14px;
  outline:none;
}
.chat-input button {
  width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
  background:linear-gradient(135deg,#FF8A2F,#E86500); color:#111;
  display:inline-flex; align-items:center; justify-content:center;
}

/* ---------- Orders ---------- */
.order-card {
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--radius); margin:0 18px 10px; padding:14px;
}
.order-card .head { display:flex; justify-content:space-between; align-items:flex-start; }
.order-card .oid { color:var(--muted); font-size:11px; letter-spacing:.05em; }
.order-card .oveh { font-weight:700; font-size:14px; margin-top:2px; letter-spacing:-.01em; }
.order-card .oprice { color:var(--accent); font-weight:800; font-size:14.5px; }
.stepper {
  display:flex; align-items:center; margin-top:14px;
}
.stepper .step { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
.stepper .step .cir {
  width:22px; height:22px; border-radius:50%;
  background:var(--surface-2); border:1px solid var(--hairline);
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:10px; font-weight:800;
  transition:all .3s var(--ease);
}
.stepper .step.done .cir { background:var(--accent); border-color:transparent; color:#111; }
.stepper .step.active .cir { background:var(--accent); border-color:transparent; color:#111; box-shadow:0 0 0 4px rgba(255,122,26,.2); }
.stepper .step .lbl { color:var(--muted); font-size:9.5px; margin-top:6px; text-transform:uppercase; letter-spacing:.04em; text-align:center; font-weight:600; }
.stepper .step.done .lbl, .stepper .step.active .lbl { color:var(--text); }
.stepper .bar {
  flex:0 0 auto; height:2px; background:var(--hairline); position:relative; align-self:flex-start; margin-top:10px;
  width:100%;
}
.step-row { display:flex; align-items:flex-start; }
.bar-wrap { flex:1; height:2px; background:var(--hairline); margin-top:10px; overflow:hidden; }
.bar-wrap .fill { height:100%; background:var(--accent); width:0; transition:width .8s var(--ease); }

/* ---------- Wallet ---------- */
.wallet-hero {
  margin:14px 18px 0; padding:20px; border-radius:18px;
  background:
    radial-gradient(circle at 100% 0%, rgba(255,122,26,.35), transparent 60%),
    linear-gradient(135deg, #1c1d21, #131418);
  border:1px solid var(--hairline);
  position:relative; overflow:hidden;
}
.wallet-hero .lbl { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
.wallet-hero .bal { font-size:34px; font-weight:800; letter-spacing:-.02em; margin-top:6px; }
.wallet-hero .sub { color:var(--muted); font-size:12px; margin-top:4px; }
.wallet-hero .row { display:flex; gap:10px; margin-top:16px; }
.tx-list { padding:6px 18px 0; }
.tx {
  display:flex; align-items:center; gap:12px; padding:12px 0;
  border-bottom:1px solid var(--hairline);
}
.tx:last-child { border-bottom:0; }
.tx .ico { width:34px; height:34px; border-radius:10px; background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; flex:0 0 34px; }
.tx .body { flex:1; min-width:0; }
.tx .t { font-weight:600; font-size:13.5px; }
.tx .d { color:var(--muted); font-size:11px; margin-top:2px; }
.tx .amt { font-weight:800; font-size:14px; letter-spacing:-.01em; }
.tx .amt.pos { color:var(--positive); }
.tx .amt.neg { color:var(--text); }

/* ---------- Analytics ---------- */
.chart-card { margin:12px 18px 0; padding:16px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); }
.chart-card h3 { margin:0 0 12px; font-size:13px; font-weight:700; letter-spacing:-.01em; }
.chart-card .row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.chart-card .kpi { font-size:22px; font-weight:800; letter-spacing:-.02em; }
.chart-card .kpi-d { color:var(--positive); font-size:12px; font-weight:600; }
.bars { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:110px; }
.bars .bar { background:linear-gradient(180deg, var(--accent), rgba(255,122,26,.4)); border-radius:6px 6px 0 0; transition:height .8s var(--ease); }
.bars .bar.muted { background:var(--surface-2); }
.bars-labels { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:6px; color:var(--muted); font-size:10px; text-align:center; }

.funnel { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.funnel .fbar { position:relative; padding:10px 12px; border-radius:8px; background:var(--surface-2); overflow:hidden; }
.funnel .fbar .fill { position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,122,26,.35), rgba(255,122,26,.08)); transform-origin:left; }
.funnel .fbar .txt { position:relative; display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; }

.rank { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline); }
.rank:last-child { border:0; }
.rank .n { color:var(--muted); width:18px; font-weight:800; }
.rank .thumb { width:44px; height:34px; border-radius:8px; background:#111 center/cover; }
.rank .title { flex:1; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank .v { color:var(--muted); font-size:11px; }

/* ---------- Add vehicle wizard ---------- */
.wizard-bar { margin:12px 18px 0; height:4px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.wizard-bar .fill { height:100%; background:var(--accent); transition:width .3s var(--ease); }
.wizard-step-label { padding:8px 18px; color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
.form-group { padding:6px 18px; }
.form-group label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; font-weight:600; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; background:var(--surface-2); border:1px solid var(--hairline); border-radius:12px;
  color:var(--text); padding:12px 14px; font-size:14px; outline:none;
  transition:border-color .15s;
  font-family:inherit;
}
.form-group input:focus { border-color:var(--accent); }
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:6px 18px; }
.photo-cell { aspect-ratio:1; border-radius:10px; background:var(--surface-2); border:1px solid var(--hairline); position:relative; overflow:hidden; }
.photo-cell.filled { background-size:cover; background-position:center; }
.photo-cell .star {
  position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%;
  background:var(--accent); color:#111;
  display:inline-flex; align-items:center; justify-content:center; font-size:11px;
}
.photo-cell.add { display:inline-flex; align-items:center; justify-content:center; color:var(--muted); font-size:22px; cursor:pointer; border-style:dashed; }
.photo-count { padding:0 18px; color:var(--muted); font-size:12px; }

.wizard-actions { padding:20px 18px 0; display:flex; gap:10px; }
.wizard-actions .btn { flex:1; }

/* ---------- Profile ---------- */
.profile-header { padding:16px 18px 8px; display:flex; gap:14px; align-items:center; }
.profile-header .big-av { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#2b2c31,#1a1b1e); border:1px solid var(--hairline); display:inline-flex; align-items:center; justify-content:center; color:var(--gold); font-weight:800; font-size:20px; letter-spacing:-.02em; }
.profile-header .n { font-weight:800; font-size:18px; letter-spacing:-.02em; }
.profile-header .e { color:var(--muted); font-size:12px; }
.doc-list { padding:6px 18px 0; }
.doc {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:12px; padding:12px 14px; margin-bottom:8px;
}
.doc .n { font-size:13.5px; font-weight:600; }
.doc .s { font-size:11px; padding:3px 8px; border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.s.approved { background:rgba(52,211,153,.12); color:var(--positive); }
.s.pending  { background:rgba(78,168,255,.12); color:var(--info); }
.s.rejected { background:rgba(255,90,95,.12); color:var(--danger); }
.settings-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--hairline);
}
.settings-row:last-child { border:0; }
.switch { width:44px; height:26px; background:var(--surface-2); border-radius:999px; position:relative; cursor:pointer; transition:background .2s; border:1px solid var(--hairline); }
.switch.on { background:var(--accent); border-color:transparent; }
.switch .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s var(--ease); }
.switch.on .knob { left:20px; background:#111; }

/* ---------- Empty state ---------- */
.empty {
  padding:60px 24px 24px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.empty svg { width:120px; height:120px; }
.empty h3 { margin:0; font-size:18px; font-weight:800; letter-spacing:-.02em; }
.empty p { margin:0; color:var(--muted); font-size:13px; max-width:280px; line-height:1.5; }

/* ---------- Sheet (modal) ---------- */
.sheet-backdrop {
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:70;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.sheet-backdrop.open { opacity:1; pointer-events:auto; }
.sheet {
  position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(100%);
  width:100%; max-width:430px;
  background:var(--bg-elevated); border-top-left-radius:24px; border-top-right-radius:24px;
  border:1px solid var(--hairline); border-bottom:0;
  z-index:71; padding:12px 0 24px; transition:transform .28s var(--ease);
  max-height:80vh; overflow-y:auto;
}
.sheet.open { transform:translateX(-50%) translateY(0); }
.sheet .grabber { width:36px; height:4px; border-radius:2px; background:var(--surface-2); margin:0 auto 8px; }
.sheet .sheet-title { padding:8px 18px 4px; font-weight:800; font-size:16px; letter-spacing:-.02em; }
.sheet .sheet-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; cursor:pointer; transition:background .12s;
}
.sheet .sheet-item:hover { background:var(--surface); }
.sheet .sheet-item .ico { width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; flex:0 0 36px; }
.sheet .sheet-item .body .t { font-weight:700; font-size:14px; }
.sheet .sheet-item .body .d { color:var(--muted); font-size:11.5px; margin-top:2px; }

/* ---------- Skeleton ---------- */
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.sk {
  background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 40%, var(--surface) 80%);
  background-size:800px 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius:8px;
}

/* utility */
.hidden { display:none !important; }
.row-flex { display:flex; align-items:center; gap:10px; }
.spread { display:flex; justify-content:space-between; align-items:center; }
.px { padding-left:18px; padding-right:18px; }

/* ---------- Toast ---------- */
.toast-wrap { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast {
  background:var(--bg-elevated); border:1px solid var(--hairline);
  padding:10px 14px 10px 12px; border-radius:12px;
  display:flex; align-items:center; gap:10px;
  font-size:13px; font-weight:600;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation: toast-in .28s var(--ease);
  color:var(--text);
  max-width:340px;
}
.toast .ico { width:24px; height:24px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 24px; }
.toast.success .ico { background:rgba(52,211,153,.16); color:var(--positive); }
.toast.info .ico { background:rgba(78,168,255,.16); color:var(--info); }
.toast.warn .ico { background:var(--accent-soft); color:var(--accent); }
.toast.error .ico { background:rgba(255,90,95,.16); color:var(--danger); }
@keyframes toast-in { 0%{opacity:0; transform:translateY(20px);} 100%{opacity:1; transform:translateY(0);} }

/* ---------- Drawer (right) ---------- */
.drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s; }
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer {
  position:fixed; right:0; top:0; height:100vh; width:100%; max-width:390px; z-index:81;
  background:var(--bg-elevated); border-left:1px solid var(--hairline);
  transform:translateX(100%); transition:transform .28s var(--ease);
  display:flex; flex-direction:column;
}
@media (min-width:900px) { .drawer { max-width:390px; } }
.drawer.open { transform:translateX(0); }
.drawer .dhead { padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--hairline); }
.drawer .dhead h3 { margin:0; font-weight:800; letter-spacing:-.02em; font-size:16px; }
.drawer .dbody { flex:1; overflow-y:auto; padding:8px 0 24px; }

/* ---------- Search overlay ---------- */
.search-overlay {
  position:fixed; inset:0; z-index:90; background:var(--bg);
  display:flex; flex-direction:column; transform:translateY(20px); opacity:0; pointer-events:none; transition:all .2s var(--ease);
}
.search-overlay.open { transform:translateY(0); opacity:1; pointer-events:auto; }
.search-overlay .sh-top { display:flex; gap:10px; padding:14px 18px; border-bottom:1px solid var(--hairline); background:var(--bg-elevated); }
.search-overlay input {
  flex:1; height:42px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hairline);
  color:var(--text); padding:0 14px; font-size:14px; outline:none; font-family:inherit;
}
.search-overlay .sh-body { flex:1; overflow-y:auto; padding:6px 0; }
.search-overlay .no-res { padding:40px 24px; text-align:center; color:var(--muted); font-size:13px; }

/* ---------- Swipe row ---------- */
.swipe-outer { position:relative; overflow:hidden; border-radius:var(--radius); }
.swipe-actions {
  position:absolute; top:0; right:0; bottom:0; display:flex; align-items:stretch;
}
.swipe-actions button {
  border:0; padding:0 16px; font-weight:700; font-size:12px; cursor:pointer;
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  color:#fff;
}
.swipe-actions .sa-pause { background:#3d3f46; }
.swipe-actions .sa-boost { background:var(--accent); color:#111; }
.swipe-actions .sa-arch  { background:var(--danger); }
.swipe-inner { position:relative; z-index:1; background:transparent; transition:transform .25s var(--ease); }
.swipe-outer.open .swipe-inner { transform:translateX(-210px); }

/* ---------- Form validation ---------- */
.form-group input.invalid, .form-group select.invalid, .form-group textarea.invalid { border-color:var(--danger); }
.form-error { color:var(--danger); font-size:11px; margin-top:4px; font-weight:600; }

/* --- inlined shared-auth.js --- */
/*!
 * Aktivemotor — shared auth/handoff module
 * Loaded by BOTH the buyer app (AKttivemotors7.html) and the dealer app
 * (aktivedealers.html). This is the one shared file both apps run on top
 * of for crossing between experiences: it does NOT replace either app&#x27;s
 * own session system, it just carries a small identity token between them
 * and keeps a lightweight shared session in localStorage.
 */
(function (global) {
  &quot;use strict&quot;;

  var SHARED_KEY = &quot;am_shared_session_v1&quot;;
  var TOKEN_PARAM = &quot;am_t&quot;;
  var TOKEN_TTL_MS = 5 * 60 * 1000; // handoff tokens are only valid for 5 minutes

  function b64encode(obj) {
    try { return btoa(encodeURIComponent(JSON.stringify(obj))); }
    catch (e) { return &quot;&quot;; }
  }
  function b64decode(str) {
    try { return JSON.parse(decodeURIComponent(atob(str))); }
    catch (e) { return null; }
  }

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SHARED_KEY)) || null; }
    catch (e) { return null; }
  }
  function setSession(obj) {
    try { localStorage.setItem(SHARED_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SHARED_KEY); } catch (e) {}
  }

  /**
   * Build a URL that hands off to another page in the product, carrying a
   * short-lived identity token in the query string (kept separate from the
   * target&#x27;s own #/hash-route). Also mirrors the same data into the shared
   * localStorage session for same-tab/back-button continuity.
   */
  function buildHandoff(targetUrl, extra) {
    var payload = Object.assign({}, getSession() || {}, extra || {}, { iat: Date.now() });
    setSession(payload);
    var token = b64encode(payload);
    var hashIdx = targetUrl.indexOf(&quot;#&quot;);
    var path = hashIdx === -1 ? targetUrl : targetUrl.slice(0, hashIdx);
    var hash = hashIdx === -1 ? &quot;&quot; : targetUrl.slice(hashIdx);
    var sep = path.indexOf(&quot;?&quot;) === -1 ? &quot;?&quot; : &quot;&amp;&quot;;
    return path + sep + TOKEN_PARAM + &quot;=&quot; + encodeURIComponent(token) + hash;
  }

  /**
   * Call once on page load. Reads ?am_t=... from the URL if present, merges
   * it into the shared session, strips the token from the visible URL, and
   * returns the resulting session (or the existing one if no token arrived).
   * Expired/garbled tokens are ignored.
   */
  function consumeHandoff() {
    var url;
    try { url = new URL(window.location.href); } catch (e) { return getSession(); }
    var raw = url.searchParams.get(TOKEN_PARAM);
    if (!raw) return getSession();

    var decoded = b64decode(raw);
    url.searchParams.delete(TOKEN_PARAM);
    try { window.history.replaceState({}, &quot;&quot;, url.toString()); } catch (e) {}

    if (!decoded || !decoded.iat || (Date.now() - decoded.iat) &gt; TOKEN_TTL_MS) {
      return getSession(); // expired or malformed — ignore, fall back to existing session
    }

/* ---------- Toast ---------- */
function toast(msg, kind=&quot;success&quot;) {
  const wrap = $(&quot;#toastWrap&quot;);
  const iconMap = { success:I.sold, info:I.eye, warn:I.boost, error:I.close };
  const t = el(&quot;div&quot;, {className:&quot;toast &quot;+kind}, `&lt;span class=&quot;ico&quot;&gt;${iconMap[kind]||I.sold}&lt;/span&gt;&lt;span&gt;${msg}&lt;/span&gt;`);
  wrap.appendChild(t);
  setTimeout(()=&gt;{ t.style.transition=&quot;opacity .3s, transform .3s&quot;; t.style.opacity=&quot;0&quot;; t.style.transform=&quot;translateY(10px)&quot;; setTimeout(()=&gt;t.remove(),300); }, 2600);
}

/* ---------- Sparkline ---------- */
function sparkline(data, w=70, h=26, color=&quot;var(--accent)&quot;) {
  const min=Math.min(...data), max=Math.max(...data), range=max-min||1;
  const step=w/(data.length-1);
  const pts=data.map((v,i)=&gt;[i*step, h-((v-min)/range)*(h-4)-2]);
  const d=pts.map((p,i)=&gt;(i?&quot;L&quot;:&quot;M&quot;)+p[0].toFixed(1)+&quot;,&quot;+p[1].toFixed(1)).join(&quot; &quot;);
  const area=d+` L ${w},${h} L 0,${h} Z`;
  return `&lt;svg class=&quot;spark&quot; viewBox=&quot;0 0 ${w} ${h}&quot; preserveAspectRatio=&quot;none&quot;&gt;
    &lt;path d=&quot;${area}&quot; fill=&quot;${color}&quot; opacity=&quot;.12&quot;/&gt;
    &lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-dasharray=&quot;220&quot; stroke-dashoffset=&quot;220&quot;&gt;
      &lt;animate attributeName=&quot;stroke-dashoffset&quot; from=&quot;220&quot; to=&quot;0&quot; dur=&quot;0.9s&quot; fill=&quot;freeze&quot;/&gt;&lt;/path&gt;
  &lt;/svg&gt;`;
}

/* ---------- Star rating ---------- */
function starRow(rating, size=13) {
  const full = Math.round(rating*2)/2;
  let s = &quot;&quot;;
  for (let i=1;i&lt;=5;i++){
    const fill = full&gt;=i ? 1 : (full&gt;=i-0.5 ? 0.5 : 0);
    s += `&lt;svg width=&quot;${size}&quot; height=&quot;${size}&quot; viewBox=&quot;0 0 24 24&quot; style=&quot;vertical-align:-2px&quot;&gt;
      &lt;defs&gt;&lt;linearGradient id=&quot;starg${i}-${size}-${Math.round(rating*10)}&quot;&gt;&lt;stop offset=&quot;${fill*100}%&quot; stop-color=&quot;var(--gold)&quot;/&gt;&lt;stop offset=&quot;${fill*100}%&quot; stop-color=&quot;var(--hairline)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
      &lt;path fill=&quot;url(#starg${i}-${size}-${Math.round(rating*10)})&quot; d=&quot;M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z&quot;/&gt;&lt;/svg&gt;`;
  }
  return `&lt;span class=&quot;mlx-stars&quot;&gt;${s}&lt;/span&gt;`;
}

/* ---------- Vehicle history / provenance check (simulated) ---------- */
function vinHash(str){
  let h = 0;
  for (let i=0;i&lt;str.length;i++){ h = (h*31 + str.charCodeAt(i)) &gt;&gt;&gt; 0; }
  return h;
}
function vinHistoryReport(vin){
  const h = vinHash(String(vin).toUpperCase().trim());
  const pick = (n) =&gt; h % n;
  const accidentCount = pick(10) &lt; 8 ? 0 : (pick(10)&lt;9.5 ? 1 : 2);
  const owners = 1 + (pick(7) &lt; 5 ? 0 : pick(7) &lt; 6 ? 1 : 2);
  const stolen = pick(97) === 3; // rare flag, deterministic per VIN
  const salvage = !stolen &amp;&amp; pick(53) === 7; // rare flag
  const serviceRecords = 3 + (h % 9);
  return {
    checked: true,
    vin: String(vin).toUpperCase().trim(),
    checkedAt: Date.now(),
    accidentCount,
    owners,
    titleStatus: stolen ? &quot;Flagged — stolen vehicle record&quot; : salvage ? &quot;Salvage title&quot; : &quot;Clean title&quot;,
    theftFlag: stolen,
    salvageFlag: salvage,
    serviceRecords,
    clean: !stolen &amp;&amp; !salvage &amp;&amp; accidentCount===0
  };
}
function historyReportHtml(v){
  const rep = v.historyReport;
  if (!v.vin){
    return `&lt;div class=&quot;mlx-panel&quot; style=&quot;margin:0 18px 18px;&quot;&gt;
      &lt;div style=&quot;font-weight:700; font-size:13px;&quot;&gt;Vehicle History Report&lt;/div&gt;
      &lt;div style=&quot;color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5;&quot;&gt;No VIN on file for this listing yet. Add a VIN in Edit to run a provenance check.&lt;/div&gt;
      &lt;button class=&quot;btn&quot; style=&quot;margin-top:10px;&quot; onclick=&quot;editVehicle(&#x27;${v.id}&#x27;)&quot;&gt;Add VIN&lt;/button&gt;
    &lt;/div&gt;`;
  }
  if (!rep){
    return `&lt;div class=&quot;mlx-panel&quot; style=&quot;margin:0 18px 18px;&quot; id=&quot;historyPanel-${v.id}&quot;&gt;
      &lt;div style=&quot;font-weight:700; font-size:13px;&quot;&gt;Vehicle History Report&lt;/div&gt;
      &lt;div style=&quot;color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5;&quot;&gt;Run a VIN-based check for accidents, theft records, title status and prior ownership.&lt;/div&gt;
      &lt;button class=&quot;btn primary&quot; style=&quot;margin-top:10px;&quot; onclick=&quot;runHistoryCheck(&#x27;${v.id}&#x27;)&quot;&gt;Run history check · ${escape(v.vin)}&lt;/button&gt;
    &lt;/div&gt;`;
  }
  const rows = [
    [&quot;Title status&quot;, rep.titleStatus, rep.theftFlag||rep.salvageFlag],
    [&quot;Accident records&quot;, rep.accidentCount===0 ? &quot;None reported&quot; : rep.accidentCount+&quot; reported&quot;, rep.accidentCount&gt;0],
    [&quot;Theft check&quot;, rep.theftFlag ? &quot;Flagged&quot; : &quot;Clear&quot;, rep.theftFlag],
    [&quot;Previous owners&quot;, rep.owners, false],
    [&quot;Service records on file&quot;, rep.serviceRecords, false]
  ];
  return `&lt;div class=&quot;mlx-panel&quot; style=&quot;margin:0 18px 18px;&quot;&gt;
    &lt;div style=&quot;display:flex; justify-content:space-between; align-items:center;&quot;&gt;
      &lt;div style=&quot;font-weight:700; font-size:13px;&quot;&gt;Vehicle History Report&lt;/div&gt;
      &lt;span class=&quot;badge-verified&quot; style=&quot;${rep.clean?&#x27;&#x27;:&#x27;background:var(--danger);color:#fff;border-color:transparent;&#x27;}&quot;&gt;
        ${rep.clean ? `&lt;svg width=&quot;10&quot; height=&quot;10&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot;&gt;&lt;path d=&quot;M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z&quot;/&gt;&lt;/svg&gt;Verified Clean` : &quot;Flagged — Review&quot;}
      &lt;/span&gt;
    &lt;/div&gt;
    &lt;div style=&quot;color:var(--muted); font-size:11px; margin-top:4px;&quot;&gt;VIN ${escape(rep.vin)} · checked ${relTime(rep.checkedAt)}&lt;/div&gt;
    &lt;div style=&quot;margin-top:10px; background:var(--surface-2); border-radius:10px; padding:2px 12px;&quot;&gt;
      ${rows.map(([k,val,flag])=&gt;`&lt;div class=&quot;settings-row&quot;&gt;&lt;div style=&quot;color:var(--muted); font-size:12px;&quot;&gt;${k}&lt;/div&gt;&lt;div style=&quot;font-weight:700; font-size:12.5px; color:${flag?&#x27;var(--danger)&#x27;:&#x27;var(--text)&#x27;}&quot;&gt;${escape(val)}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}
    &lt;/div&gt;
    &lt;div style=&quot;color:var(--muted); font-size:10.5px; margin-top:8px; line-height:1.5;&quot;&gt;Simulated provenance check for demo purposes — a production build would call a real VIN registry / theft &amp; title database.&lt;/div&gt;
    &lt;button class=&quot;btn&quot; style=&quot;margin-top:10px;&quot; onclick=&quot;runHistoryCheck(&#x27;${v.id}&#x27;, true)&quot;&gt;Re-check&lt;/button&gt;
  &lt;/div&gt;`;
}
function runHistoryCheck(vid, silent){
  const v = state.vehicles.find(x=&gt;x.id===vid); if (!v || !v.vin) return;
  const panel = document.getElementById(&quot;historyPanel-&quot;+vid);
  if (panel &amp;&amp; !silent) panel.innerHTML = `&lt;div style=&quot;display:flex;align-items:center;gap:10px;padding:6px 0;&quot;&gt;
    &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;&lt;div style=&quot;font-size:12.5px;color:var(--muted);&quot;&gt;Checking VIN ${escape(v.vin)} against registry, theft &amp; title records…&lt;/div&gt;&lt;/div&gt;`;
  setTimeout(()=&gt;{
    v.historyReport = vinHistoryReport(v.vin);
    saveState();
    toast(v.historyReport.clean ? &quot;History check complete · clean record&quot; : &quot;History check complete · flags found&quot;, v.historyReport.clean ? &quot;success&quot; : &quot;warn&quot;);
    render();
  }, silent ? 200 : 1100);
}

function renderFeed() {
  const items = state.notifications.slice(0,10);
  const groups = { &quot;Today&quot;:[], &quot;This week&quot;:[] };
  items.forEach(n =&gt; { const age=(Date.now()-n.when)/86400000; (age&lt;1?groups[&quot;Today&quot;]:groups[&quot;This week&quot;]).push(n); });
  let h = &quot;&quot;;
  for (const g in groups) {
    if (!groups[g].length) continue;
    h += `&lt;div class=&quot;group-label&quot;&gt;${g}&lt;/div&gt;`;
    h += groups[g].map(a=&gt;`
      &lt;div class=&quot;item&quot;&gt;

}

/* ---------- Swipe gestures ---------- */
function attachSwipe(root) {
  root.querySelectorAll(&quot;.swipe-outer&quot;).forEach(outer=&gt;{
    const inner = outer.querySelector(&quot;.swipe-inner&quot;);
    let sx=0, dx=0, active=false;
    inner.addEventListener(&quot;touchstart&quot;, e=&gt;{ sx=e.touches[0].clientX; active=true; inner.style.transition=&quot;none&quot;; }, {passive:true});
    inner.addEventListener(&quot;touchmove&quot;, e=&gt;{
      if(!active) return;
      dx = Math.min(0, Math.max(-220, e.touches[0].clientX - sx));
      inner.style.transform = `translateX(${dx}px)`;
    }, {passive:true});
    inner.addEventListener(&quot;touchend&quot;, ()=&gt;{
      active=false; inner.style.transition=&quot;&quot;;
      if (dx &lt; -80) outer.classList.add(&quot;open&quot;); else { outer.classList.remove(&quot;open&quot;); inner.style.transform=&quot;&quot;; }
      dx=0;
    });
    outer.addEventListener(&quot;mouseleave&quot;, ()=&gt;{ outer.classList.remove(&quot;open&quot;); inner.style.transform=&quot;&quot;; });
  });
}

function actPause(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  v.status = v.status===&quot;pending&quot; ? &quot;available&quot; : &quot;pending&quot;;
  saveState(); toast(`${v.title} — ${v.status===&quot;pending&quot;?&quot;paused&quot;:&quot;resumed&quot;}`, &quot;info&quot;); render();
}
function actArchive(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  v.status = &quot;archived&quot;; saveState(); toast(`Archived ${v.title}`, &quot;warn&quot;); render();
}
function actUnarchive(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  v.status = &quot;available&quot;; saveState(); toast(`${v.title} restored`, &quot;success&quot;); render();
}
function actMarkSold(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  v.status=&quot;sold&quot;;
  const commission = Math.round(v.price*0.025);
  state.wallet.balance += commission;
  state.wallet.tx.unshift({t:`Sale commission — ${v.model}`, d:Date.now(), amt:commission, ico:&quot;in&quot;, cls:&quot;pos&quot;});
  state.notifications.unshift({id:Date.now(),t:&quot;sold&quot;,text:`&lt;b&gt;${escape(v.title)}&lt;/b&gt; marked as Sold`,when:Date.now(),unread:true});
  saveState(); toast(`${v.title} sold — ${NGN(commission)} commission credited`, &quot;success&quot;); render();

function openBoostSheet(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  const opts = [
    {label:&quot;7 days&quot;, price:5000, days:7},
    {label:&quot;14 days&quot;, price:9500, days:14},
    {label:&quot;30 days · Best&quot;, price:18000, days:30}
  ];
  openSheet(`

    ${opts.map(o=&gt;`

function applyBoost(id, price, days) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  if (state.wallet.balance &lt; price) { closeSheet(); toast(&quot;Insufficient wallet balance&quot;, &quot;error&quot;); return; }

  state.wallet.tx.unshift({t:`Boost fee — ${v.model} (${days}d)`, d:Date.now(), amt:-price, ico:&quot;out&quot;});
  v.boosted = true;
  state.notifications.unshift({id:Date.now(),t:&quot;boost&quot;,text:`Boost active on &lt;b&gt;${escape(v.title)}&lt;/b&gt; for ${days} days`,when:Date.now(),unread:true});

}

function saveEdit(id) {
  const v = state.vehicles.find(x=&gt;x.id===id); if(!v) return;
  const p = parseInt(($(&quot;#ed_price&quot;).value||&quot;&quot;).toString().replace(/[^\d]/g,&quot;&quot;),10);
  const k = parseInt(($(&quot;#ed_km&quot;).value||&quot;&quot;).toString().replace(/[^\d]/g,&quot;&quot;),10);
  const c = $(&quot;#ed_city&quot;).value.trim();
  if(!p||!k||!c){ toast(&quot;Fill all fields&quot;, &quot;error&quot;); return; }
  v.price=p; v.km=k; v.city=c;
  const g = sel =&gt; { const e = $(sel); return e ? e.value : undefined; };
  v.condition = g(&quot;#ed_condition&quot;) || v.condition;

function sendChat(leadId, text) {
  const lead = state.leads.find(l=&gt;l.id===leadId); if(!lead||!text||!text.trim()) return;
  lead.messages.push({who:&quot;me&quot;, txt:text.trim(), time:Date.now()});
  lead.when = Date.now();
  saveState();
  const scroll = $(&quot;#chatMsgs&quot;);
  if (scroll) {
    scroll.insertAdjacentHTML(&quot;beforeend&quot;, `&lt;div class=&quot;bubble me&quot;&gt;${escape(text.trim())}&lt;span class=&quot;time num&quot;&gt;${new Date().toLocaleTimeString(&quot;en-NG&quot;,{hour:&quot;numeric&quot;,minute:&quot;2-digit&quot;})}&lt;/span&gt;&lt;/div&gt;`);
    scroll.scrollTop = scroll.scrollHeight;
  }
  setTimeout(()=&gt;{
    const v = state.vehicles.find(x=&gt;x.id===lead.vid);
    const suggested = v ? Math.round(v.price*0.94/100000)*100000 : 1000000;
    const replies = [&quot;Okay, noted 👍&quot;,&quot;Great, I&#x27;ll come by tomorrow.&quot;,&quot;Can we do ₦&quot;+suggested.toLocaleString(&quot;en-NG&quot;)+&quot;?&quot;,&quot;Thanks for the info.&quot;,&quot;Perfect, sending payment soon.&quot;];
    const r = replies[Math.floor(Math.random()*replies.length)];
    lead.messages.push({who:&quot;them&quot;, txt:r, time:Date.now()});
    lead.when = Date.now(); saveState();
    if (currentRoute()===&quot;chat&quot; &amp;&amp; param()===leadId) {
      const s = $(&quot;#chatMsgs&quot;);
      if (s) { s.insertAdjacentHTML(&quot;beforeend&quot;, `&lt;div class=&quot;bubble them&quot;&gt;${escape(r)}&lt;span class=&quot;time num&quot;&gt;${new Date().toLocaleTimeString(&quot;en-NG&quot;,{hour:&quot;numeric&quot;,minute:&quot;2-digit&quot;})}&lt;/span&gt;&lt;/div&gt;`); s.scrollTop=s.scrollHeight; }
    } else {
      lead.unread = (lead.unread||0)+1;
      state.notifications.unshift({id:Date.now(),t:&quot;msg&quot;,text:`${escape(lead.name)}: ${escape(r)}`,when:Date.now(),unread:true});
      saveState(); updateNotifBadge();
      toast(`${lead.name}: ${r}`, &quot;info&quot;);
    }
  }, 1400 + Math.random()*1200);
}

function advanceOrder(id) {
  const o = state.orders.find(x=&gt;x.id===id); if(!o) return;

    const commission = Math.round(o.price*0.025);
    state.wallet.balance += commission;
    const v = state.vehicles.find(x=&gt;x.id===o.vid);
    state.wallet.tx.unshift({t:`Sale commission — ${v?v.model:o.vid}`, d:Date.now(), amt:commission, ico:&quot;in&quot;, cls:&quot;pos&quot;});
    if (v) v.status=&quot;sold&quot;;
    toast(`Delivered — ${NGN(commission)} commission credited`, &quot;success&quot;);
  } else {
    toast(`${o.id} advanced`, &quot;info&quot;);
  }
  saveState(); render();
}

        &lt;div style=&quot;flex:1; display:flex; gap:10px;&quot;&gt;
          &lt;div style=&quot;flex:1; background:var(--surface-2); border-radius:10px; padding:10px 12px;&quot;&gt;
            &lt;div class=&quot;num&quot; style=&quot;font-weight:800; font-size:14px;&quot;&gt;${Math.round(avgBoostViews).toLocaleString()}&lt;/div&gt;
            &lt;div style=&quot;color:var(--muted); font-size:10.5px;&quot;&gt;Avg. views · boosted (${boosted.length})&lt;/div&gt;
          &lt;/div&gt;
          &lt;div style=&quot;flex:1; background:var(--surface-2); border-radius:10px; padding:10px 12px;&quot;&gt;
            &lt;div class=&quot;num&quot; style=&quot;font-weight:800; font-size:14px;&quot;&gt;${Math.round(avgPlainViews).toLocaleString()}&lt;/div&gt;
            &lt;div style=&quot;color:var(--muted); font-size:10.5px;&quot;&gt;Avg. views · standard (${plain.length})&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;chart-card&quot;&gt;&lt;h3&gt;Most viewed vehicles&lt;/h3&gt;
      ${top.map((t,i)=&gt;`&lt;div class=&quot;rank&quot;&gt;
        &lt;div class=&quot;n num&quot;&gt;${i+1}&lt;/div&gt;
        &lt;div class=&quot;thumb&quot; style=&quot;background-image:url(&#x27;${t.photo}&#x27;)&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;title&quot;&gt;${escape(t.title)} &lt;span style=&quot;color:var(--muted); font-weight:500;&quot;&gt;· ${NGN(t.price)}&lt;/span&gt;&lt;/div&gt;
        ${sparkline(t.views7,50,22)}
        &lt;div class=&quot;v num&quot;&gt;${t.views.toLocaleString()}&lt;/div&gt;
      &lt;/div&gt;`).join(&quot;&quot;)}
    &lt;/div&gt;
  `;
}

    &lt;div class=&quot;wizard-actions&quot;&gt;
      ${wizardStep&gt;1?`&lt;button class=&quot;btn&quot; onclick=&quot;wizardStep--;render()&quot;&gt;Back&lt;/button&gt;`:&quot;&quot;}
      &lt;button class=&quot;btn primary&quot; onclick=&quot;wizardNext()&quot;&gt;${wizardStep===5?&quot;Publish listing&quot;:&quot;Continue&quot;}&lt;/button&gt;

    `;
  }
  const p = parseInt((wizardData.price+&quot;&quot;).replace(/[^\d]/g,&quot;&quot;),10) || 0;

function onPriceInput() {
  const raw = ($(&quot;#w_price&quot;).value||&quot;&quot;).replace(/[^\d]/g,&quot;&quot;);
  const p = parseInt(raw,10);
  wizardData.price = raw;
  const h = $(&quot;#marketHint&quot;);
  if (h) h.innerHTML = p ? getMarketHint(p, wizardData) : &quot;&quot;;
}
function getMarketHint(price, wd) {
  const comps = state.vehicles.filter(v=&gt;v.type===wd.type);
  const avg = comps.length ? comps.reduce((s,v)=&gt;s+v.price,0)/comps.length : price;
  const diff = ((price-avg)/avg)*100;
  const abs = Math.abs(diff).toFixed(0);
  if (Math.abs(diff)&lt;3) return `&lt;div class=&quot;market-pill&quot; style=&quot;margin:6px 18px 0; background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.3); color:var(--positive);&quot;&gt;✓ Priced at market · expect steady interest&lt;/div&gt;`;
  if (diff&lt;0) return `&lt;div class=&quot;market-pill&quot; style=&quot;margin:6px 18px 0;&quot;&gt;This is ${abs}% below similar listings — expect faster leads&lt;/div&gt;`;
  return `&lt;div class=&quot;market-pill&quot; style=&quot;margin:6px 18px 0; background:rgba(255,90,95,.08); border-color:rgba(255,90,95,.3); color:var(--danger);&quot;&gt;This is ${abs}% above similar listings — may sell slowly&lt;/div&gt;`;
}
function toggleWizardFeature(f) {
  const i = wizardData.features.indexOf(f);
  if (i&gt;-1) wizardData.features.splice(i,1); else wizardData.features.push(f);
  render();
}
function collectWizardStep() {
  if (wizardStep===1) {
    [&quot;make&quot;,&quot;model&quot;,&quot;year&quot;,&quot;km&quot;,&quot;type&quot;,&quot;color&quot;,&quot;trans&quot;,&quot;city&quot;].forEach(k=&gt;{ const e=$(&quot;#w_&quot;+k); if(e) wizardData[k]=e.value.trim(); });
  }
  if (wizardStep===2) {
    [&quot;condition&quot;,&quot;fuel&quot;,&quot;engine&quot;,&quot;hp&quot;,&quot;drivetrain&quot;,&quot;seats&quot;,&quot;vin&quot;,&quot;warranty&quot;,&quot;description&quot;].forEach(k=&gt;{ const e=$(&quot;#w_&quot;+k); if(e) wizardData[k]=e.value.trim(); });
  }
  if (wizardStep===4) {
    const p=$(&quot;#w_price&quot;); if(p) wizardData.price = (p.value||&quot;&quot;).replace(/[^\d]/g,&quot;&quot;);
    const n=$(&quot;#w_neg&quot;); if(n) wizardData.negotiable = n.value;
    const b=$(&quot;#w_boost&quot;); if(b) wizardData.boost = b.value;
  }
}
function validateWizardStep() {
  if (wizardStep===1) {
    let ok = true;
    [&quot;make&quot;,&quot;model&quot;,&quot;year&quot;,&quot;km&quot;].forEach(k=&gt;{
      const e = $(&quot;#w_&quot;+k);
      if (!wizardData[k]) { e &amp;&amp; e.classList.add(&quot;invalid&quot;); ok=false; } else e &amp;&amp; e.classList.remove(&quot;invalid&quot;);
    });
    const y = parseInt(wizardData.year,10);
    if (!(y&gt;=1990 &amp;&amp; y&lt;=2027)) { $(&quot;#w_year&quot;) &amp;&amp; $(&quot;#w_year&quot;).classList.add(&quot;invalid&quot;); ok=false; }
    if (!ok) toast(&quot;Fill all required fields&quot;, &quot;error&quot;);
    return ok;
  }
  if (wizardStep===4) {
    const p = parseInt(wizardData.price,10);
    if (!p || p&lt;100000) { $(&quot;#w_price&quot;) &amp;&amp; $(&quot;#w_price&quot;).classList.add(&quot;invalid&quot;); toast(&quot;Enter a valid price&quot;, &quot;error&quot;); return false; }
  }
  return true;
}
function wizardNext() {
  collectWizardStep();
  if (!validateWizardStep()) return;
  if (wizardStep===5) { publishVehicle(); return; }
  wizardStep++; render();
}
function handlePhotoUpload(evt) {
  const files = Array.from(evt.target.files||[]).slice(0, 20-wizardData.photos.length);
  let pending = files.length;
  if (!pending) return;
  files.forEach(f=&gt;{
    const r = new FileReader();
    r.onload = e =&gt; {
      wizardData.photos.push(e.target.result);
      pending--;
      if (pending===0) { toast(`${files.length} photo${files.length&gt;1?&quot;s&quot;:&quot;&quot;} added`, &quot;success&quot;); render(); }
    };
    r.readAsDataURL(f);
  });
}
function removePhoto(i) { wizardData.photos.splice(i,1); render(); }
function publishVehicle() {
  const p = parseInt(wizardData.price,10);
  const km = parseInt(wizardData.km,10);
  const primary = wizardData.photos[0] || carArt(wizardData.type, CAR_COLORS[wizardData.color]);
  const v = {
    id: uid(),
    make:wizardData.make, model:wizardData.model, year:wizardData.year,
    type:wizardData.type, color:wizardData.color,
    title:`${wizardData.make} ${wizardData.model} ${wizardData.year}`,
    price:p, km, city:wizardData.city, trans:wizardData.trans, fuel:wizardData.fuel||&quot;Petrol&quot;,
    condition:wizardData.condition||&quot;Nigerian Used&quot;,
    engine:wizardData.engine||&quot;—&quot;, hp:wizardData.hp||&quot;&quot;, drivetrain:wizardData.drivetrain||&quot;FWD&quot;,
    seats:wizardData.seats||&quot;5&quot;, vin: wizardData.vin || (&quot;MLX&quot;+Math.floor(100000+Math.random()*900000)),
    warranty:wizardData.warranty||&quot;As-is, no warranty&quot;, description:wizardData.description||&quot;&quot;,
    features: wizardData.features.slice(),
    status:&quot;available&quot;,
    photo:primary,
    photos: wizardData.photos.length ? wizardData.photos.slice() : [primary],
    views7:Array.from({length:7},()=&gt;sr(2,8)),
    views:0, favs:0, leadsCount:0, messages:0,
    createdAt: Date.now(),
    boosted: wizardData.boost!==&quot;None&quot;
  };
  state.vehicles.unshift(v);
  if (wizardData.boost!==&quot;None&quot;) {
    const price = wizardData.boost.includes(&quot;30&quot;) ? 18000 : 5000;
    state.wallet.balance -= price;
    state.wallet.tx.unshift({t:`Boost fee — ${v.model}`, d:Date.now(), amt:-price, ico:&quot;out&quot;});
  }
  state.notifications.unshift({id:Date.now(),t:&quot;car&quot;,text:`Published &lt;b&gt;${escape(v.title)}&lt;/b&gt;`,when:Date.now(),unread:true});
  saveState();
  initWizard();
  toast(`${v.title} is live`, &quot;success&quot;);
  navigate(&quot;detail/&quot;+v.id);
}

/* ---------- Search ---------- */
function openSearch() {
  const o = $(&quot;#searchOverlay&quot;); o.classList.add(&quot;open&quot;);
  setTimeout(()=&gt;{ $(&quot;#searchInput&quot;).value=&quot;&quot;; $(&quot;#searchInput&quot;).focus(); runSearch(&quot;&quot;); }, 60);
}
function closeSearch() { $(&quot;#searchOverlay&quot;).classList.remove(&quot;open&quot;); }
function runSearch(q) {
  const query = q.trim().toLowerCase();
  const body = $(&quot;#searchBody&quot;);
  if (!query) {
    body.innerHTML = `&lt;div style=&quot;padding:18px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;&quot;&gt;Recent&lt;/div&gt;` +
      state.vehicles.slice(0,5).map(miniRow).join(&quot;&quot;);
    return;
  }
  const vRes = state.vehicles.filter(v =&gt; v.title.toLowerCase().includes(query) || v.city.toLowerCase().includes(query));
  const lRes = state.leads.filter(l =&gt; l.name.toLowerCase().includes(query));
  const oRes = state.orders.filter(o =&gt; o.id.toLowerCase().includes(query) || o.buyer.toLowerCase().includes(query));
  let html = &quot;&quot;;
  if (vRes.length) html += `&lt;div style=&quot;padding:14px 18px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;&quot;&gt;Vehicles&lt;/div&gt;` + vRes.slice(0,8).map(miniRow).join(&quot;&quot;);
  if (lRes.length) html += `&lt;div style=&quot;padding:14px 18px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;&quot;&gt;Leads&lt;/div&gt;` + lRes.map(l=&gt;`&lt;div class=&quot;notif&quot; onclick=&quot;closeSearch();navigate(&#x27;chat/${l.id}&#x27;)&quot;&gt;&lt;div class=&quot;ico&quot;&gt;${I.lead}&lt;/div&gt;&lt;div style=&quot;flex:1;&quot;&gt;&lt;div class=&quot;t&quot;&gt;${escape(l.name)}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;${escape((state.vehicles.find(v=&gt;v.id===l.vid)||{}).title||&quot;&quot;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;);
  if (oRes.length) html += `&lt;div style=&quot;padding:14px 18px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;&quot;&gt;Orders&lt;/div&gt;` + oRes.map(o=&gt;`&lt;div class=&quot;notif&quot; onclick=&quot;closeSearch();navigate(&#x27;orders&#x27;)&quot;&gt;&lt;div class=&quot;ico&quot;&gt;${I.paid}&lt;/div&gt;&lt;div style=&quot;flex:1;&quot;&gt;&lt;div class=&quot;t&quot;&gt;${o.id} · ${escape(o.buyer)}&lt;/div&gt;&lt;div class=&quot;m num&quot;&gt;${NGN(o.price)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;);
  body.innerHTML = html || `&lt;div class=&quot;no-res&quot;&gt;No results for &quot;${escape(query)}&quot;&lt;/div&gt;`;
}
function miniRow(v) {
  return `&lt;div class=&quot;notif&quot; onclick=&quot;closeSearch();navigate(&#x27;detail/${v.id}&#x27;)&quot;&gt;

/* ---------- Count-up ---------- */
function animateCounts(root) {
  root.querySelectorAll(&quot;[data-count]&quot;).forEach(elm=&gt;{
    const target = parseFloat(elm.dataset.count);
    const fmt = elm.dataset.fmt;
    const dur = 900, start=performance.now();
    function tick(t){
      const p=Math.min((t-start)/dur,1), e=1-Math.pow(1-p,3);
      const val=Math.round(target*e);
      elm.textContent = fmt===&quot;ngn&quot; ? &quot;₦&quot;+val.toLocaleString(&quot;en-NG&quot;) : val.toLocaleString(&quot;en-NG&quot;);
      if(p&lt;1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
  root.querySelectorAll(&quot;.bars .bar[data-h]&quot;).forEach(b=&gt;{ requestAnimationFrame(()=&gt;b.style.height=b.dataset.h+&quot;px&quot;); });
  root.querySelectorAll(&quot;.bar-wrap .fill[data-target]&quot;).forEach(f=&gt;{ requestAnimationFrame(()=&gt;f.style.width=f.dataset.target+&quot;%&quot;); });
}

/* ============================================================

(function(){

  /* ---------- deterministic pseudo-random per vehicle ---------- */
  function h32(s){
    let h=2166136261;
    for(let i=0;i&lt;s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    h^=h&gt;&gt;&gt;15; h=Math.imul(h,2246822507); h^=h&gt;&gt;&gt;13; h=Math.imul(h,3266489909); h^=h&gt;&gt;&gt;16;

  const rnd = (id,salt,a,b)=&gt; a + h32(id+salt)*(b-a);

  /* ---------- Market value engine (CarGurus IMV) ---------- */
  function marketValue(v){
    const comps = state.vehicles.filter(x=&gt;x.id!==v.id &amp;&amp; (x.type===v.type || x.make===v.make));
    const base = comps.length ? comps.reduce((s,x)=&gt;s+x.price/Math.max(1,(2025-(+x.year||2020))*0.06+1),0)/comps.length : v.price;
    const yearAdj = 1 + ((+v.year||2020)-2021)*0.055;
    const kmAdj = 1 - Math.min(0.22, (v.km||0)/500000);
    const brand = {&quot;Mercedes-Benz&quot;:1.18,&quot;BMW&quot;:1.12,&quot;Lexus&quot;:1.1,&quot;Range Rover&quot;:1.24,&quot;Toyota&quot;:1.04,&quot;Acura&quot;:1.02}[v.make]||1;
    const blend = (base*0.35 + v.price*0.65) * yearAdj * kmAdj * brand / (yearAdj*kmAdj*brand*0.35 + 0.65);
    return Math.round((blend * (0.94 + rnd(v.id,&quot;mv&quot;,0,0.14)))/10000)*10000;
  }
  function dealRating(v){
    const mv = marketValue(v);
    const pct = (mv - v.price)/mv*100;
    let label=&quot;Fair Price&quot;, cls=&quot;fair&quot;;
    if (pct&gt;=9){ label=&quot;Great Deal&quot;; cls=&quot;great&quot;; }
    else if (pct&gt;=4){ label=&quot;Good Deal&quot;; cls=&quot;good&quot;; }
    else if (pct&gt;=-3){ label=&quot;Fair Price&quot;; cls=&quot;fair&quot;; }
    else if (pct&gt;=-9){ label=&quot;Above Market&quot;; cls=&quot;high&quot;; }
    else { label=&quot;Overpriced&quot;; cls=&quot;over&quot;; }
    return { mv, pct, label, cls };
  }
  function daysOnLot(v){ return Math.max(1, Math.round((Date.now()-(v.createdAt||Date.now()))/86400000)); }
  function crScore(v){ return (2.6 + rnd(v.id,&quot;cr&quot;,0,2.3)).toFixed(1); }
  function vinOf(v){
    const c=&quot;ABCDEFGHJKLMNPRSTUVWXYZ0123456789&quot;;
    let x = Math.floor(h32(v.id+&quot;|vin&quot;)*4294967295)&gt;&gt;&gt;0, s=&quot;&quot;;
    for(let i=0;i&lt;17;i++){ x = (Math.imul(x,1664525)+1013904223)&gt;&gt;&gt;0; s += c[x % c.length]; }
    return s;
  }

    let list = inventoryFilter===&quot;all&quot; ? state.vehicles.slice() : state.vehicles.filter(v=&gt;v.status===inventoryFilter);

    if (F.maxPrice) list = list.filter(v=&gt;v.price&lt;=F.maxPrice);
    const s = F.sort;
    list.sort((a,b)=&gt;{
      if (s===&quot;price-asc&quot;) return a.price-b.price;
      if (s===&quot;price-desc&quot;) return b.price-a.price;
      if (s===&quot;km&quot;) return a.km-b.km;
      if (s===&quot;age&quot;) return daysOnLot(b)-daysOnLot(a);

  /* ---------- Auctions (Copart / Manheim wholesale lanes) ---------- */
  const LANES = [
    { id:&quot;A&quot;, name:&quot;Lane A — Premium SUV&quot;, host:&quot;Lagos Digital Block&quot; },
    { id:&quot;B&quot;, name:&quot;Lane B — Executive Sedan&quot;, host:&quot;Abuja Simulcast&quot; },
    { id:&quot;C&quot;, name:&quot;Lane C — Truck, Fleet &amp; Commercial&quot;, host:&quot;Port Harcourt Yard&quot; }
  ];
  let activeLane = &quot;A&quot;;
  const WKEY = &quot;Aktivemotor-watchlist&quot;;
  let watch; try { watch = new Set(JSON.parse(localStorage.getItem(WKEY)||&quot;[]&quot;)); } catch(e){ watch = new Set(); }
  const saveWatch = ()=&gt;localStorage.setItem(WKEY, JSON.stringify([...watch]));
  let runs = null;
  function buildRuns(){
    runs = state.vehicles.filter(v=&gt;v.status!==&quot;sold&quot;&amp;&amp;v.status!==&quot;archived&quot;).slice(0,12).map((v,i)=&gt;{
      const lane = v.type===&quot;suv&quot; ? &quot;A&quot; : v.type===&quot;sedan&quot; ? &quot;B&quot; : &quot;C&quot;;
      const start = Math.round(v.price*(0.72+rnd(v.id,&quot;st&quot;,0,0.08))/50000)*50000;
      return {
        vid:v.id, lane, run:100+i*3,
        bid:start, bids:Math.floor(rnd(v.id,&quot;bd&quot;,2,28)),
        reserve: Math.round(v.price*0.88), ends: Date.now() + (90+i*47)*1000,
        seller:[&quot;Aktivemotor Retail&quot;,&quot;Fleet Partner NG&quot;,&quot;Bank Repo Desk&quot;,&quot;Lease Return&quot;][i%4],
        myBid:0, sold:false
      };
    });
  }
  window.mlSetLane = function(id){ activeLane=id; render(); };
  window.mlWatch = function(vid,ev){
    if(ev) ev.stopPropagation();
    if (!auctionAccessActive()) { toast(&quot;Pay the auction access fee to use this lane&quot;,&quot;warn&quot;); return; }
    watch.has(vid)?watch.delete(vid):watch.add(vid); saveWatch(); toast(watch.has(vid)?&quot;Added to watchlist&quot;:&quot;Removed from watchlist&quot;,&quot;info&quot;); render();
  };
  window.mlBid = function(vid, ev){
    if (ev) ev.stopPropagation();
    if (!auctionAccessActive()) { toast(&quot;Pay the auction access fee to bid&quot;,&quot;warn&quot;); return; }
    const r = runs.find(x=&gt;x.vid===vid); if(!r||r.sold) return;
    const inc = Math.max(50000, Math.round(r.bid*0.02/50000)*50000);
    r.bid += inc; r.bids++; r.myBid = r.bid;
    toast(&quot;Bid placed at &quot;+NGN(r.bid), &quot;success&quot;);
    paintAuction();
  };
  window.mlProxy = function(vid, ev){
    if (ev) ev.stopPropagation();
    if (!auctionAccessActive()) { toast(&quot;Pay the auction access fee to set a proxy bid&quot;,&quot;warn&quot;); return; }
    const r = runs.find(x=&gt;x.vid===vid); if(!r) return;
    const v = state.vehicles.find(x=&gt;x.id===vid);
    openSheet(`
      &lt;div class=&quot;sheet-head&quot;&gt;&lt;h3&gt;Proxy bid — ${escape(v.title)}&lt;/h3&gt;&lt;span class=&quot;x&quot; onclick=&quot;closeSheet()&quot;&gt;✕&lt;/span&gt;&lt;/div&gt;
      &lt;div style=&quot;padding:4px 4px 16px;&quot;&gt;
        &lt;div class=&quot;ml-sub&quot; style=&quot;margin-bottom:10px;&quot;&gt;Current bid ${NGN(r.bid)} · Reserve ${r.bid&gt;=r.reserve?&quot;met&quot;:&quot;not met&quot;} · Run #${r.run}&lt;/div&gt;
        &lt;input id=&quot;mlProxyAmt&quot; class=&quot;ml-select&quot; style=&quot;width:100%;padding:12px;font-size:15px;&quot; type=&quot;number&quot; step=&quot;50000&quot; value=&quot;${r.bid+250000}&quot;/&gt;
        &lt;button class=&quot;ml-btn primary&quot; style=&quot;width:100%;margin-top:12px;padding:12px;&quot; onclick=&quot;mlProxySet(&#x27;${vid}&#x27;)&quot;&gt;Set maximum bid&lt;/button&gt;
      &lt;/div&gt;`);
  };
  window.mlProxySet = function(vid){
    const r = runs.find(x=&gt;x.vid===vid); const amt = +document.getElementById(&quot;mlProxyAmt&quot;).value;
    if (!r || !amt || amt&lt;=r.bid) { toast(&quot;Enter an amount above the current bid&quot;,&quot;warn&quot;); return; }
    r.myBid = amt; if (r.bid &lt; amt) { r.bid = Math.min(amt, r.bid + Math.round(r.bid*0.02)); r.bids++; }
    closeSheet(); toast(&quot;Proxy set to &quot;+NGN(amt),&quot;success&quot;); paintAuction();
  };
  function cdText(ms){
    if (ms&lt;=0) return &quot;Sold&quot;;
    const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,&quot;0&quot;)+&quot;:&quot;+String(s%60).padStart(2,&quot;0&quot;);
  }
  function runHtml(r){
    const v = state.vehicles.find(x=&gt;x.id===r.vid); if(!v) return &quot;&quot;;
    const left = r.ends-Date.now();
    const cr = crScore(v);
    return `&lt;div class=&quot;ml-run&quot; data-run=&quot;${r.vid}&quot;&gt;
      &lt;div class=&quot;ph&quot; style=&quot;background-image:url(&#x27;${v.photo}&#x27;)&quot;&gt;&lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;rt&quot;&gt;${escape(v.title)} &lt;span class=&quot;ml-sub&quot;&gt;· Run #${r.run}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;rm&quot;&gt;${kkm(v.km)} · ${v.trans} · ${escape(v.city)} · VIN ${vinOf(v)}&lt;/div&gt;
        &lt;div class=&quot;rm&quot;&gt;Seller: ${r.seller} · ${r.bid&gt;=r.reserve?&#x27;&lt;span style=&quot;color:var(--deal-great)&quot;&gt;Reserve met&lt;/span&gt;&#x27;:&#x27;&lt;span style=&quot;color:var(--deal-high)&quot;&gt;Reserve not met&lt;/span&gt;&#x27;} · ${r.bids} bids&lt;/div&gt;
        &lt;div class=&quot;ml-cr&quot; style=&quot;margin-top:6px;&quot;&gt;CR ${cr}&lt;span class=&quot;ml-crbar&quot;&gt;&lt;i style=&quot;width:${cr/5*100}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;${dealBadge(v)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;bid&quot;&gt;
        &lt;div class=&quot;amt&quot; data-amt&gt;${NGN(r.bid)}&lt;/div&gt;
        &lt;div class=&quot;cd ${left&lt;30000?&#x27;urgent&#x27;:&#x27;&#x27;}&quot; data-cd&gt;${r.sold?&quot;Sold&quot;:cdText(left)}&lt;/div&gt;
        ${r.myBid?`&lt;div class=&quot;ml-sub&quot;&gt;Your max ${NGN(r.myBid)}&lt;/div&gt;`:&quot;&quot;}
        &lt;div class=&quot;acts&quot;&gt;
          &lt;button class=&quot;ml-btn watch ${watch.has(v.id)?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;mlWatch(&#x27;${v.id}&#x27;,event)&quot;&gt;${watch.has(v.id)?&quot;Watching&quot;:&quot;Watch&quot;}&lt;/button&gt;
          &lt;button class=&quot;ml-btn&quot; onclick=&quot;mlProxy(&#x27;${v.id}&#x27;,event)&quot;&gt;Proxy&lt;/button&gt;
          &lt;button class=&quot;ml-btn primary&quot; onclick=&quot;mlBid(&#x27;${v.id}&#x27;,event)&quot; ${r.sold?&quot;disabled&quot;:&quot;&quot;}&gt;Bid +2%&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }
  function screenAuctions(){
    if (!auctionAccessActive()) return auctionPaywallHtml();
    if (!runs) buildRuns();
    const lane = LANES.find(l=&gt;l.id===activeLane);
    const list = runs.filter(r=&gt;r.lane===activeLane);
    const watching = runs.filter(r=&gt;watch.has(r.vid)).length;
    return `
      ${window.auctionTabsHtml(&#x27;auctions&#x27;)}
      &lt;div class=&quot;subhead&quot;&gt;&lt;h1&gt;Live auction lanes&lt;/h1&gt;&lt;div class=&quot;sub&quot;&gt;${lane.host} &lt;span class=&quot;ml-dot&quot;&gt;·&lt;/span&gt; simulcast &lt;span class=&quot;ml-dot&quot;&gt;·&lt;/span&gt; &lt;span class=&quot;ml-access-pill&quot;&gt;Access active · ${auctionDaysLeft()}d left&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stats&quot;&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Running now&lt;/div&gt;&lt;div class=&quot;value num&quot;&gt;${list.length}&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;&lt;span class=&quot;ml-live&quot;&gt;&lt;b&gt;&lt;/b&gt;Live&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Watchlist&lt;/div&gt;&lt;div class=&quot;value num&quot;&gt;${watching}&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Across all lanes&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Your active bids&lt;/div&gt;&lt;div class=&quot;value num&quot;&gt;${runs.filter(r=&gt;r.myBid).length}&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Proxy + live&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Avg. reserve gap&lt;/div&gt;&lt;div class=&quot;value num small&quot;&gt;${NGN(Math.max(0,list.reduce((s,r)=&gt;s+Math.max(0,r.reserve-r.bid),0)/Math.max(1,list.length)))}&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;To clear block&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ml-lanes&quot;&gt;
        ${LANES.map(l=&gt;{
          const n = runs.filter(r=&gt;r.lane===l.id).length;
          return `&lt;div class=&quot;ml-lane ${l.id===activeLane?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;mlSetLane(&#x27;${l.id}&#x27;)&quot;&gt;
            &lt;div class=&quot;ln&quot;&gt;${l.id===activeLane?&#x27;&lt;span class=&quot;ml-live&quot;&gt;&lt;b&gt;&lt;/b&gt;Live&lt;/span&gt;&#x27;:&quot;Lane &quot;+l.id}&lt;/div&gt;
            &lt;div class=&quot;lt&quot;&gt;${l.name.split(&quot;— &quot;)[1]}&lt;/div&gt;
            &lt;div class=&quot;lm&quot;&gt;${n} unit${n===1?&quot;&quot;:&quot;s&quot;} · ${l.host}&lt;/div&gt;
          &lt;/div&gt;`;
        }).join(&quot;&quot;)}
      &lt;/div&gt;
      &lt;div class=&quot;section-title&quot;&gt;&lt;h2&gt;Run list&lt;/h2&gt;&lt;a onclick=&quot;mlSetLane(&#x27;${activeLane}&#x27;)&quot;&gt;Refresh&lt;/a&gt;&lt;/div&gt;
      &lt;div style=&quot;margin:0 18px 24px;&quot;&gt;${list.map(runHtml).join(&quot;&quot;)}&lt;/div&gt;`;
  }
  function paintAuction(){
    if (currentRoute()!==&quot;auctions&quot; || !runs) return;
    runs.filter(r=&gt;r.lane===activeLane).forEach(r=&gt;{
      const row = document.querySelector(&#x27;[data-run=&quot;&#x27;+r.vid+&#x27;&quot;]&#x27;); if(!row) return;
      const left = r.ends-Date.now();
      if (left&lt;=0 &amp;&amp; !r.sold) r.sold = true;
      row.querySelector(&quot;[data-amt]&quot;).textContent = NGN(r.bid);
      const cd = row.querySelector(&quot;[data-cd]&quot;);
      cd.textContent = r.sold ? &quot;Sold&quot; : cdText(left);
      cd.classList.toggle(&quot;urgent&quot;, !r.sold &amp;&amp; left&lt;30000);
    });
  }
  setInterval(()=&gt;{
    if (window.__akSuspended) return;
    if (!runs || currentRoute()!==&quot;auctions&quot;) return;
    runs.forEach(r=&gt;{
      if (r.sold) return;
      if (Math.random()&lt;0.18){ r.bid += Math.max(50000, Math.round(r.bid*0.015/50000)*50000); r.bids++; }
      if (r.myBid &amp;&amp; r.bid &lt; r.myBid &amp;&amp; Math.random()&lt;0.5) r.bid = Math.min(r.myBid, r.bid+50000);
    });
    paintAuction();
  }, 1000);

  /* ---------- Detail merchandising (Carvana / CarMax / Cars.com) ---------- */

    const d = dealRating(v);
    const pinPct = Math.max(2, Math.min(98, 50 - d.pct*3.2));
    const cr = crScore(v);
    const cond = [[&quot;Exterior&quot;,0.72],[&quot;Interior&quot;,0.86],[&quot;Frame &amp; structure&quot;,0.95],[&quot;Mechanical&quot;,0.81],[&quot;Tyres &amp; brakes&quot;,0.68],[&quot;Electronics&quot;,0.9]];
    const hist = Array.from({length:8},(_,i)=&gt; v.price*(1.08 - i*0.012 + rnd(v.id,&quot;h&quot;+i,-0.012,0.012)));

    const pill = sc.querySelector(&quot;.market-pill&quot;);
    const gauge = document.createElement(&quot;div&quot;);
    gauge.className = &quot;ml-gauge&quot;;
    gauge.innerHTML = `

      &lt;div class=&quot;ml-scale&quot;&gt;&lt;span&gt;Great deal&lt;/span&gt;&lt;span&gt;Market ${NGN(d.mv)}&lt;/span&gt;&lt;span&gt;Overpriced&lt;/span&gt;&lt;/div&gt;

        &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Vs market&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:${d.pct&gt;=0?&#x27;var(--deal-great)&#x27;:&#x27;var(--deal-over)&#x27;}&quot;&gt;${Math.abs(d.pct).toFixed(1)}% ${d.pct&gt;=0?&quot;below&quot;:&quot;above&quot;}&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Days on lot&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${daysOnLot(v)}&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Condition grade&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${cr} / 5.0&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;k&quot;&gt;VIN&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;font-size:12px;&quot;&gt;${vinOf(v)}&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Stock #&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;font-size:12px;&quot;&gt;${v.id}&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;`;
    if (pill) pill.replaceWith(gauge); else sc.appendChild(gauge);

    // 360 spin on the gallery
    const gal = sc.querySelector(&quot;.gallery&quot;);

    if (gal &amp;&amp; photos.length&gt;1){
      gal.classList.add(&quot;ml-spin&quot;);
      const hint = document.createElement(&quot;div&quot;);
      hint.className = &quot;hint&quot;; hint.textContent = &quot;Drag to spin · 360°&quot;;
      gal.appendChild(hint);
      const img = gal.querySelector(&quot;.g-img&quot;);

      const set = i =&gt; { idx=(i%photos.length+photos.length)%photos.length; img.style.backgroundImage=`url(&#x27;${photos[idx]}&#x27;)`; };
      const start = x =&gt; { down=true; sx=x; };
      const move = x =&gt; { if(!down) return; const dx=x-sx; if(Math.abs(dx)&gt;26){ set(idx + (dx&gt;0?1:-1)); sx=x; } };
      gal.addEventListener(&quot;mousedown&quot;, e=&gt;{ e.preventDefault(); start(e.clientX); });

        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-title&quot;&gt;&lt;h2&gt;Price history &amp;amp; market trend&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;ml-gauge&quot;&gt;
        &lt;div class=&quot;hdr&quot;&gt;&lt;h3&gt;Last 8 weeks&lt;/h3&gt;&lt;span class=&quot;ml-sub&quot;&gt;Comparable set: ${state.vehicles.filter(x=&gt;x.type===v.type).length} units&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;ml-scale&quot; style=&quot;margin-top:8px;&quot;&gt;&lt;span&gt;${NGN(Math.min(...hist))}&lt;/span&gt;&lt;span&gt;Trend ${hist[7]&lt;hist[0]?&quot;softening&quot;:&quot;firming&quot;}&lt;/span&gt;&lt;span&gt;${NGN(Math.max(...hist))}&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;section-title&quot;&gt;&lt;h2&gt;Wholesale options&lt;/h2&gt;&lt;/div&gt;

  /* ---------- Router wrapper ---------- */
  const baseRender = window.render;
  window.removeEventListener(&quot;hashchange&quot;, baseRender);
  window.render = function(){
    const r = currentRoute();
    if (r===&quot;auctions&quot;){
      if (auctionAccessActive() &amp;&amp; !runs) buildRuns();

      const fab = document.getElementById(&quot;fab&quot;); if (fab) fab.style.display=&quot;none&quot;;
      const sc = document.getElementById(&quot;screen&quot;);
      sc.innerHTML = screenAuctions(); sc.scrollTop = 0; animateCounts(sc);

  function seedSpace(){
    space = state.vehicles.filter(v=&gt;v.status===&quot;available&quot;).slice(0,6).map((v,i)=&gt;{
      const market = mv(v);
      const ask = Math.round(market*(0.78 + (i%3)*0.04)/50000)*50000;
      const tier = [&quot;spotlight&quot;,&quot;featured&quot;,&quot;standard&quot;][i%3];
      const start = ask - Math.round(ask*0.06/50000)*50000;
      const lot = { id:&quot;LOT-&quot;+(2400+i*7), vid:v.id, ask, market, tier, fee:TIERS[tier].fee,
        listedAt: Date.now()-(i+1)*36e5, endsAt: Date.now() + (i+1)*(36e5*7), bids:[], status:&quot;live&quot;, top:start, seller:DEALER.name };
      const n = 2 + (i%4);
      let amt = start;
      for (let k=0;k&lt;n;k++){ amt += Math.round(amt*0.012/10000)*10000;
        lot.bids.push({ who:BIDDERS[(i+k)%BIDDERS.length], amt, at: Date.now()-(n-k)*9e5, me:false }); }
      lot.top = amt;
      return lot;
    });
    saveSpace();
