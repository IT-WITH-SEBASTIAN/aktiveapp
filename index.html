<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Aktivemotor — Unified (Buyer + Dealer)</title>
<meta name="description" content="Aktivemotor unified single-file app: buyer marketplace and dealer terminal in one AppShell."/>
<style>
  :root {
    --bar-bg:#0B0B0D; --bar-fg:#F4F4F2; --accent:#FF7A1A; --muted:#9A9CA5;
  }
  html,body{margin:0;padding:0;height:100%;background:#000;color:var(--bar-fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #akshell{position:fixed;inset:0}
  #akbar{
    position:absolute;top:14px;right:14px;z-index:30;
    display:flex;align-items:flex-start;gap:8px;
    touch-action:none;
  }
  #akbar.dragging{transition:none;user-select:none}
  #akbar.dragging .mode-panel{display:none!important}
  .drag-handle{
    appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(20,20,22,.92);
    color:var(--muted);width:30px;height:30px;border-radius:999px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;cursor:grab;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:13px;letter-spacing:1px;line-height:1;padding:0 0 2px;
  }
  .drag-handle:active{cursor:grabbing;background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.4)}

  /* quick "back to buyer" pill — only shown while in Dealer mode */
  #akBackToBuyer{
    appearance:none;border:1px solid rgba(255,122,26,.35);background:rgba(20,20,22,.92);
    color:var(--accent);padding:8px 14px;border-radius:999px;font-weight:700;font-size:12.5px;
    cursor:pointer;white-space:nowrap;display:none;align-items:center;gap:6px;
    transition:.15s;box-shadow:0 6px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #akBackToBuyer:hover{background:rgba(255,122,26,.18);border-color:rgba(255,122,26,.55)}
  #akBackToBuyer:active{transform:scale(.96)}
  #akbar[data-mode="dealer"] #akBackToBuyer{display:inline-flex}

  /* collapsible mode chip + dropdown */
  .mode-dd{position:relative}
  .mode-chip{
    appearance:none;display:inline-flex;align-items:center;gap:8px;
    border:1px solid rgba(255,255,255,.12);background:rgba(20,20,22,.92);color:var(--bar-fg);
    padding:8px 13px 8px 9px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;
    transition:.15s;box-shadow:0 6px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .mode-chip:hover{border-color:rgba(255,122,26,.4);background:#1d1e22}
  .mode-dd.open .mode-chip{border-color:var(--accent);background:#1d1e22}
  .mode-chip .mode-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .mode-chip .chev{width:12px;height:12px;flex:0 0 auto;transition:transform .18s ease;opacity:.7}
  .mode-dd.open .mode-chip .chev{transform:rotate(180deg)}

  .mode-panel{
    position:absolute;top:calc(100% + 8px);left:0;z-index:20;min-width:190px;
    background:#151519;border:1px solid rgba(255,255,255,.1);border-radius:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;
    transform-origin:top left;
    opacity:0;transform:scale(.94) translateY(-4px);pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;
  }
  .mode-dd.open .mode-panel{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
  .mode-opt{
    appearance:none;width:100%;border:0;background:transparent;color:var(--bar-fg);
    display:flex;align-items:center;gap:10px;text-align:left;
    padding:9px 10px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;
  }
  .mode-opt:hover{background:rgba(255,255,255,.06)}
  .mode-opt.active{color:var(--accent)}
  .mode-opt .opt-ico{width:16px;text-align:center;flex:0 0 auto;font-size:13px}
  .mode-opt .opt-check{margin-left:auto;color:var(--accent);font-weight:800;display:none}
  .mode-opt.active .opt-check{display:inline}
  .mode-sep{height:1px;background:rgba(255,255,255,.08);margin:5px 6px}
  .mode-opt.danger{color:#ff8a6a}
  .mode-opt.danger:hover{background:rgba(255,90,40,.1)}
  .mode-who{padding:4px 10px 2px;color:var(--muted);font-size:11.5px;font-weight:600}
  #akframes{position:absolute;inset:0;background:#000}
  /* Only the active pane is ever rendered/composited. display:none fully removes
     the inactive app from layout/paint/compositing (unlike opacity:0), which is
     what actually stops the background app from costing paint time. We also
     explicitly suspend its JS timers via postMessage as a belt-and-braces fix,
     since a hidden iframe's script keeps running even under display:none. */
  #akframes iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;
    display:none;
  }
  #akframes iframe.active{display:block;animation:akfadein .18s ease-out}
  @keyframes akfadein{from{opacity:0}to{opacity:1}}
  #akbar.switching .mode-chip,#akbar.switching #akBackToBuyer{pointer-events:none;opacity:.7}
  #akLoading{
    position:absolute;inset:0;z-index:5;display:none;
    align-items:center;justify-content:center;background:#0B0B0D;color:var(--muted);
    font-size:13px;gap:10px;flex-direction:column;
  }
  #akLoading.show{display:flex}
  #akLoading .spin{
    width:28px;height:28px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:akspin .7s linear infinite;
  }
  @keyframes akspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="akshell">
  <div id="akbar" role="banner" data-mode="buyer">
    <button id="akDragHandle" class="drag-handle" title="Drag to move" aria-label="Drag to reposition this control">⠿⠿</button>
    <button id="akBackToBuyer" title="Switch back to Buyer" aria-label="Switch back to Buyer app">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Buyer
    </button>
    <div class="mode-dd" id="akModeDD">
      <button class="mode-chip" id="akModeChip" aria-haspopup="true" aria-expanded="false">
        <span class="mode-dot"></span>
        <span id="akModeLabel">Buyer</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="mode-panel" id="akModePanel" role="menu" aria-label="App mode options">
        <button class="mode-opt active" id="akModeBuyer" role="menuitemradio" aria-checked="true">
          <span class="opt-ico">🛒</span> Buyer <span class="opt-check">✓</span>
        </button>
        <button class="mode-opt" id="akModeDealer" role="menuitemradio" aria-checked="false">
          <span class="opt-ico">🏬</span> Dealer <span class="opt-check">✓</span>
        </button>
        <div class="mode-sep"></div>
        <button class="mode-opt danger" id="akReset" title="Clear all local data and start fresh" aria-label="Reset app to fresh onboarding state">
          <span class="opt-ico">⟲</span> Reset app
        </button>
        <div class="mode-sep"></div>
        <div class="mode-who" id="akWho">Guest</div>
      </div>
    </div>
  </div>
  <div id="akframes">
    <div id="akLoading"><div class="spin"></div><div>Loading Dealer terminal…</div></div>
    <iframe id="akBuyer" class="active" title="Aktivemotor Buyer" srcdoc="&lt;!doctype html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot; /&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1, viewport-fit=cover&quot; /&gt;
&lt;title&gt;Aktivemotor — Buy vehicles online in Nigeria&lt;/title&gt;
&lt;meta name=&quot;theme-color&quot; content=&quot;#0057ff&quot; /&gt;
&lt;style&gt;
:root{
  --primary:#0057ff; --primary-600:#0046cc; --secondary:#0ea5e9; --accent:#14b8a6;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
  --bg:#f8fafc; --bg-2:#eef2f8; --surface:#fff; --surface-2:#f4f7fb;
  --text:#0f172a; --muted:#64748b; --line:rgba(15,23,42,.09);
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.75);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
  --shadow:0 8px 30px rgba(15,23,42,.1);
  --shadow-lg:0 24px 60px -20px rgba(15,23,42,.35);
  --grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --grad-soft:linear-gradient(135deg,rgba(0,87,255,.12),rgba(20,184,166,.12));
  --r:18px; --r-sm:12px; --r-lg:26px; --nav-h:70px;
}
html[data-theme=&quot;dark&quot;]{
  --bg:#0b1220; --bg-2:#0f172a; --surface:#1e293b; --surface-2:#16233b;
  --text:#f1f5f9; --muted:#94a3b8; --line:rgba(255,255,255,.09);
  --glass:rgba(30,41,59,.72); --glass-brd:rgba(255,255,255,.09);
  --shadow:0 10px 40px rgba(0,0,0,.45); --shadow-lg:0 30px 70px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;
  color:var(--text); background:var(--bg-2);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 8% -10%,rgba(0,87,255,.12),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(20,184,166,.10),transparent 55%),
    var(--bg-2);
  min-height:100vh; min-height:100dvh;
}
h1,h2,h3,h4{font-family:-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;margin:0;letter-spacing:-.02em;font-weight:800}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}

/* ---------- app root: fluid across phones/tablets/desktop ---------- */
#app{
  width:100%; max-width:1280px; margin:0 auto;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 48px);
}
.shell{padding:0 clamp(14px,3vw,28px)}
.screen{animation:fade .4s cubic-bezier(.22,.9,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{100%{background-position:200% 0}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  background:var(--glass); border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1280px;margin:0 auto;
  padding:10px clamp(14px,3vw,28px);
  display:flex; align-items:center; gap:10px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.03em;cursor:pointer}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(0,87,255,.35)}
.loc-pill{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.icon-row{margin-left:auto;display:flex;align-items:center;gap:6px;position:relative}
.ibtn{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.18s}
.ibtn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
.count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* dropdown menu */
.menu-wrap{position:relative}
.menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:80;
  min-width:220px; padding:8px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow-lg);
  animation:pop .18s cubic-bezier(.22,.9,.3,1);
}
.menu-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:10px; cursor:pointer;
  font-size:14px; font-weight:600;
}
.menu-item:hover{background:var(--surface-2)}
.menu-item .mi-i{width:32px;height:32px;border-radius:10px;background:var(--grad-soft);color:var(--primary);display:grid;place-items:center;font-size:15px}
.menu-item .mi-count{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--grad);color:#fff}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  width:100%; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);
  border-top:1px solid var(--line); box-shadow:var(--shadow-lg);
}
.bottomnav-in{
  max-width:1280px;margin:0 auto;height:var(--nav-h);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:0 clamp(14px,3vw,28px);
}
.nav-i{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;padding:6px 0;transition:.2s}
.nav-i span.ic{font-size:19px;transition:.25s}
.nav-i.on{color:var(--primary);font-weight:700}
.nav-i.on span.ic{transform:translateY(-2px) scale(1.12)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-brd);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;border-radius:14px;padding:12px 18px;font-weight:650;font-size:14px;background:var(--grad);color:#fff;box-shadow:0 12px 26px -12px rgba(0,87,255,.7);transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--grad-soft);color:var(--primary);box-shadow:none}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.wide{width:100%}
.btn.lg{padding:15px 22px;font-size:15px;border-radius:16px}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .6s linear;background:rgba(255,255,255,.45);pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);outline:none;transition:.2s;font-size:14px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,87,255,.14);background:var(--surface)}
.label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 3px;display:block}
.field{margin-bottom:12px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--grad-soft);color:var(--primary)}
.badge.ok{background:rgba(34,197,94,.14);color:#16a34a}
.badge.warn{background:rgba(245,158,11,.16);color:#b45309}
.badge.dan{background:rgba(239,68,68,.14);color:var(--danger)}
.badge.mut{background:var(--surface-2);color:var(--muted)}
.tag{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:var(--surface);cursor:pointer;white-space:nowrap;transition:.2s}
.tag:hover{border-color:var(--primary);color:var(--primary)}
.tag.on{background:var(--grad);color:#fff;border-color:transparent}

.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.sec-head h3{font-size:17px}
.sec-head .more{font-size:13px;color:var(--primary);font-weight:650;cursor:pointer}
.muted{color:var(--muted)}
.fs12{font-size:12px}.fs13{font-size:13px}.fs14{font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

/* responsive grids */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:1fr}
@media (min-width:600px){
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:900px){
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{grid-template-columns:1.5fr 1fr}
}
@media (min-width:1100px){
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
}

.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.hscroll &gt; *{scroll-snap-align:start;flex:0 0 auto}
.hscroll::-webkit-scrollbar{height:0}

/* ---------- vehicle card ---------- */
.vcard{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);cursor:pointer;transition:.28s cubic-bezier(.22,.9,.3,1)}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.vthumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface-2)}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,.9,.3,1)}
.vcard:hover .vthumb img{transform:scale(1.06)}
.vthumb .chips{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.vthumb .fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;font-size:15px}
.vbody{padding:14px}
.vtitle{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.vmeta{font-size:12px;color:var(--muted);margin-top:3px}
.vprice{font-weight:800;font-size:17px;letter-spacing:-.02em}
.specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.specs span{background:var(--surface-2);padding:4px 8px;border-radius:8px}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:280px;display:flex;align-items:flex-end;box-shadow:var(--shadow-lg)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:&quot;&quot;;position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,18,.85),rgba(3,7,18,.35) 60%,rgba(3,7,18,.1))}
.hero-in{position:relative;z-index:2;padding:26px;color:#fff;max-width:620px;animation:slideIn .7s cubic-bezier(.22,.9,.3,1)}
.hero-in h1{font-size:clamp(22px,4vw,38px);line-height:1.08}
.hero-in p{opacity:.86;margin-top:10px;font-size:14px}
@media (min-width:900px){.hero{min-height:360px}.hero-in{padding:36px}}

/* ---------- brands ---------- */
.brand-chip{width:92px;display:grid;justify-items:center;gap:8px;cursor:pointer}
.brand-logo{width:60px;height:60px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow-sm);transition:.25s}
.brand-chip:hover .brand-logo{transform:translateY(-4px) rotate(-3deg);box-shadow:var(--shadow)}

/* ---------- auth ---------- */
.auth{min-height:calc(100vh - var(--nav-h) - 60px);display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(460px,100%);padding:28px;border-radius:var(--r-lg);animation:pop .5s cubic-bezier(.22,.9,.3,1)}
.otp-row{display:flex;gap:8px;justify-content:space-between}
.otp-row input{width:100%;aspect-ratio:1;text-align:center;font-size:20px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);outline:none}
.otp-row input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,87,255,.14)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:&quot;&quot;;height:1px;flex:1;background:var(--line)}

/* splash */
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(150deg,#04102b,#0057ff 55%,#0ea5e9);color:#fff}
.splash .mark{width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:42px;animation:float 2.6s ease-in-out infinite;border:1px solid rgba(255,255,255,.28)}
.bar{width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:24px}
.bar i{display:block;height:100%;width:0;background:#fff;animation:load 1.9s cubic-bezier(.5,0,.2,1) forwards}
@keyframes load{to{width:100%}}

/* misc */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:&quot;&quot;;position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item::before{content:&quot;&quot;;position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl-item.done::before{background:var(--success);border-color:var(--success)}
.tl-item.now::before{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 5px rgba(0,87,255,.18)}

.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.22,.9,.3,1)}

.acc{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer;padding:14px 4px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc p{padding:0 4px 14px;color:var(--muted);font-size:14px}

.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;transition:.2s}
.list-item:hover{background:var(--surface-2)}
.av{width:44px;height:44px;border-radius:14px;background:var(--grad-soft);display:grid;place-items:center;font-weight:700;color:var(--primary);flex:0 0 auto;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}

.modal-bg{position:fixed;inset:0;background:rgba(3,7,18,.55);backdrop-filter:blur(6px);z-index:120;display:grid;place-items:center;padding:20px;animation:fade .25s}
.modal{width:min(420px,100%);padding:22px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.22,.9,.3,1);max-height:82vh;overflow:auto}

.snack{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:150;padding:12px 20px;border-radius:14px;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);transition:.35s cubic-bezier(.22,.9,.3,1);pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.snack.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 26px);z-index:70;width:56px;height:56px;border-radius:20px;border:0;background:var(--grad);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 18px 40px -12px rgba(0,87,255,.85);animation:float 3.4s ease-in-out infinite}
.chatbot{position:fixed;right:12px;left:12px;bottom:calc(var(--nav-h) + 88px);z-index:71;width:auto;max-width:380px;margin-left:auto;height:min(470px,60vh);display:flex;flex-direction:column;border-radius:22px;overflow:hidden;animation:pop .3s}
.bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.45}
.bubble.me{margin-left:auto;background:var(--grad);color:#fff;border-bottom-right-radius:5px}
.bubble.them{background:var(--surface-2);border-bottom-left-radius:5px}
.typing i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:float 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.gallery-main{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10;background:var(--surface-2);position:relative}
.gallery-main img{width:100%;height:100%;object-fit:cover;animation:fade .4s}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:6px}
.thumbs img{width:88px;height:60px;flex:0 0 88px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.55;border:2px solid transparent;transition:.2s}
.thumbs img.on,.thumbs img:hover{opacity:1;border-color:var(--primary)}

.spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px;gap:12px}
.spec-row span:first-child{color:var(--muted)}
.spec-row span:last-child{font-weight:600;text-align:right}

.stars{color:#f59e0b;letter-spacing:1px;font-size:13px}
.map{position:relative;height:260px;border-radius:var(--r);overflow:hidden;background:
  repeating-linear-gradient(0deg,var(--surface-2) 0 38px,var(--line) 38px 39px),
  repeating-linear-gradient(90deg,var(--surface-2) 0 46px,var(--line) 46px 47px)}
.map .pin{position:absolute;font-size:26px;animation:float 2.4s infinite;cursor:pointer}
.map .route{position:absolute;left:12%;top:70%;width:70%;height:2px;background:var(--primary);border-radius:2px;transform:rotate(-22deg);box-shadow:0 0 0 4px rgba(0,87,255,.14)}

.seg{display:inline-flex;padding:4px;gap:4px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.slider{width:100%;accent-color:var(--primary)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:10px}

.kpi{padding:16px;border-radius:16px;background:var(--surface-2)}
.kpi b{font-size:20px;display:block;font-weight:800}

.chart{display:flex;align-items:flex-end;gap:6px;height:120px}
.chart i{flex:1;background:var(--grad);border-radius:8px 8px 4px 4px;opacity:.85;transition:height .6s}

.pay-card{border-radius:20px;padding:22px;color:#fff;background:linear-gradient(135deg,#0f172a,#0057ff);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.pay-card::after{content:&quot;&quot;;position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09);right:-60px;top:-80px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:12.5px;cursor:pointer}
.cal div:hover{background:var(--surface-2)}
.cal div.on{background:var(--grad);color:#fff;font-weight:700}
.cal div.hd{color:var(--muted);font-size:11px;cursor:default}

.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin:16px 0 10px}
.back:hover{color:var(--primary)}
.page-title{font-size:clamp(20px,3vw,28px);margin-bottom:6px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:18px}

/* --- inlined shared-auth.js --- */
/*!
 * Aktivemotor — shared auth/handoff module
 * Loaded by BOTH the buyer app (AKttivemotors7.html) and the dealer app
 * (aktivedealers.html). This is the one shared file both apps run on top
 * of for crossing between experiences: it does NOT replace either app&#x27;s
 * own session system, it just carries a small identity token between them
 * and keeps a lightweight shared session in localStorage.
 */
(function (global) {
  &quot;use strict&quot;;

  var SHARED_KEY = &quot;am_shared_session_v1&quot;;
  var TOKEN_PARAM = &quot;am_t&quot;;
  var TOKEN_TTL_MS = 5 * 60 * 1000; // handoff tokens are only valid for 5 minutes

  function b64encode(obj) {
    try { return btoa(encodeURIComponent(JSON.stringify(obj))); }
    catch (e) { return &quot;&quot;; }
  }
  function b64decode(str) {
    try { return JSON.parse(decodeURIComponent(atob(str))); }
    catch (e) { return null; }
  }

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SHARED_KEY)) || null; }
    catch (e) { return null; }
  }
  function setSession(obj) {
    try { localStorage.setItem(SHARED_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SHARED_KEY); } catch (e) {}
  }

  /**
   * Build a URL that hands off to another page in the product, carrying a
   * short-lived identity token in the query string (kept separate from the
   * target&#x27;s own #/hash-route). Also mirrors the same data into the shared
   * localStorage session for same-tab/back-button continuity.
   */
  function buildHandoff(targetUrl, extra) {
    var payload = Object.assign({}, getSession() || {}, extra || {}, { iat: Date.now() });
    setSession(payload);
    var token = b64encode(payload);
    var hashIdx = targetUrl.indexOf(&quot;#&quot;);
    var path = hashIdx === -1 ? targetUrl : targetUrl.slice(0, hashIdx);
    var hash = hashIdx === -1 ? &quot;&quot; : targetUrl.slice(hashIdx);
    var sep = path.indexOf(&quot;?&quot;) === -1 ? &quot;?&quot; : &quot;&amp;&quot;;
    return path + sep + TOKEN_PARAM + &quot;=&quot; + encodeURIComponent(token) + hash;
  }

  /**
   * Call once on page load. Reads ?am_t=... from the URL if present, merges
   * it into the shared session, strips the token from the visible URL, and
   * returns the resulting session (or the existing one if no token arrived).
   * Expired/garbled tokens are ignored.
   */
  function consumeHandoff() {
    var url;
    try { url = new URL(window.location.href); } catch (e) { return getSession(); }
    var raw = url.searchParams.get(TOKEN_PARAM);
    if (!raw) return getSession();

    var decoded = b64decode(raw);
    url.searchParams.delete(TOKEN_PARAM);
    try { window.history.replaceState({}, &quot;&quot;, url.toString()); } catch (e) {}

    if (!decoded || !decoded.iat || (Date.now() - decoded.iat) &gt; TOKEN_TTL_MS) {
      return getSession(); // expired or malformed — ignore, fall back to existing session
    }
    var merged = Object.assign({}, getSession() || {}, decoded);
    setSession(merged);
    return merged;
  }

  global.AktiveAuth = {
    getSession: getSession,
    setSession: setSession,
    clearSession: clearSession,
    buildHandoff: buildHandoff,
    consumeHandoff: consumeHandoff
  };
})(window);

  function getAuction(v){
    let a = S.auctionState[v.id];
    if(!a){
      a = { currentBid: v.startingBid, bids: [], endsAt: Date.now() + v.auctionHours*3600000 };
      S.auctionState[v.id] = a;
      save(&quot;auctionState&quot;, S.auctionState);
    }
    return a;
  }
  function minNextBid(v,a){
    return a.currentBid + Math.max(50000, Math.round(v.marketValue*0.02/50000)*50000);
  }
  function countdown(endsAt){
    const ms = endsAt - Date.now();
    if(ms&lt;=0) return &quot;Auction ended&quot;;
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return h&gt;0 ? `${h}h ${m}m left` : `${m}m left`;
  }
  function placeBid(id, amount){
    const v = veh(id);
    if(!v || !v.auction) return;
    const a = getAuction(v);
    if(Date.now() &gt; a.endsAt) return snack(&quot;This auction has already ended&quot;);
    const min = minNextBid(v,a);
    if(!amount || amount &lt; min) return snack(`Bid must be at least ${money(min)}`);
    a.bids.unshift({ bidder: S.user.name, amount, time: Date.now() });
    a.currentBid = amount;
    save(&quot;auctionState&quot;, S.auctionState);
    snack(&quot;Bid placed — you&#x27;re the highest bidder! 🔨&quot;);
    render();
  }
  function submitAuctionListing(d){
    if(!d.brand || !d.model || !d.value || !d.start){ snack(&quot;Please fill in brand, model, value and starting bid&quot;); return; }
    const id = &quot;u&quot;+Date.now();
    const v = {
      id, brand:d.brand, model:d.model, year:+d.year||new Date().getFullYear(),
      condition:&quot;Nigerian Used&quot;, body:d.body||&quot;Sedan&quot;, fuel:&quot;Petrol&quot;,
      title:`${d.year||&quot;&quot;} ${d.brand} ${d.model}`.trim(),
      price:+d.value, discount:0, monthly:0,
      mileage:+d.mileage||60000, transmission:&quot;Automatic&quot;, drive:&quot;FWD&quot;,
      engine:&quot;—&quot;, hp:150, mpg:&quot;—&quot;, color:&quot;—&quot;, vin:&quot;USR&quot;+Math.floor(100000+Math.random()*900000),
      safety:&quot;4.0&quot;, rating:&quot;4.5&quot;, reviews:0, warranty:&quot;As-is, no warranty&quot;,
      seats:5, location:S.user.city, dealerId:null,
      images:[CAR_IMGS[Math.floor(Math.random()*CAR_IMGS.length)],CAR_IMGS[Math.floor(Math.random()*CAR_IMGS.length)],INT_IMGS[0]],
      features:[], flash:false, auction:true, financing:false, luxury:false,
      addedDays:0, views:0,
      auctionReason:d.reason, marketValue:+d.value, startingBid:+d.start, auctionHours:+d.duration||48,
      ownerListed:true
    };
    DB.vehicles.unshift(v);
    S.userListings.unshift(v);
    save(&quot;userListings&quot;, S.userListings);
    getAuction(v);
    snack(&quot;Your car is now live in the Auction space 🔨&quot;);
    go(&quot;#/auction/&quot;+id);
  }
  /* -------- live-market value check (simulated FX-linked global pricing) -------- */
  const GLOBAL_BASE_USD = { luxury:34000, mainstream:14000, emerging:9000, budget_moto:700, default:11500 };
  function tierFor(brand){
    if(/Mercedes|BMW|Range Rover|Land Rover|Lexus|Tesla|Audi|Porsche/.test(brand)) return &quot;luxury&quot;;
    if(/Toyota|Honda|Ford|Nissan|Hyundai|Kia|Volkswagen/.test(brand)) return &quot;mainstream&quot;;
    if(/Bajaj|Jincheng|Qlink/.test(brand)) return &quot;budget_moto&quot;;
    if(/Innoson|GAC|Changan|Geely|Peugeot/.test(brand)) return &quot;emerging&quot;;
    return &quot;default&quot;;
  }
  S.fxState = load(&quot;fxState&quot;, { rate: 1652, updatedAt: 0 });
  function tickFx(){
    const now = Date.now();
    if(now - S.fxState.updatedAt &gt; 20000){
      const drift = (Math.random()-0.5) * 6;
      S.fxState.rate = Math.max(1400, Math.min(1900, S.fxState.rate + drift));
      S.fxState.updatedAt = now;
      save(&quot;fxState&quot;, S.fxState);
    }
    return S.fxState.rate;
  }
  function estimateValue({brand, year, mileage, condition}){
    const rate = tickFx();
    const usd = GLOBAL_BASE_USD[tierFor(brand||&quot;&quot;)] ?? GLOBAL_BASE_USD.default;
    const age = Math.max(0, new Date().getFullYear() - (+year || new Date().getFullYear()));
    const ageFactor = Math.max(0.35, 1 - age*0.055);
    const mileageFactor = Math.max(0.6, 1 - (Math.max(0,(+mileage||0)-20000)/300000));
    const condFactor = condition===&quot;Brand New&quot; ? 1.15 : condition===&quot;Foreign Used&quot; ? 1.0 : 0.85;
    const ngn = usd * rate * ageFactor * mileageFactor * condFactor;
    return { ngn: Math.round(ngn/50000)*50000, rate, usd };
  }
  function fxTicker(){
    const rate = tickFx();
    return `&lt;span class=&quot;badge mut&quot; title=&quot;Simulated live global exchange-market feed&quot;&gt;💱 ₦${Math.round(rate).toLocaleString()}/$ · live&lt;/span&gt;`;
  }
  function openValueCheck(){
    const brands = DB.brands.map(b=&gt;b.name);
    modal(&quot;Value Check&quot;, `
      &lt;p class=&quot;fs13 muted&quot; style=&quot;margin-bottom:12px&quot;&gt;Estimate a car&#x27;s fair price from current global market rates, before you bid or list — so you don&#x27;t overpay or get overpriced.&lt;/p&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot;&gt;Brand&lt;/label&gt;&lt;select class=&quot;input&quot; id=&quot;vcBrand&quot;&gt;${brands.map(b=&gt;`&lt;option&gt;${esc(b)}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot;&gt;Year&lt;/label&gt;&lt;input class=&quot;input&quot; id=&quot;vcYear&quot; type=&quot;number&quot; placeholder=&quot;2019&quot; value=&quot;2019&quot; /&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot;&gt;Mileage (km)&lt;/label&gt;&lt;input class=&quot;input&quot; id=&quot;vcMileage&quot; type=&quot;number&quot; placeholder=&quot;60000&quot; value=&quot;60000&quot; /&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot;&gt;Condition&lt;/label&gt;&lt;select class=&quot;input&quot; id=&quot;vcCondition&quot;&gt;
        &lt;option&gt;Nigerian Used&lt;/option&gt;&lt;option&gt;Foreign Used&lt;/option&gt;&lt;option&gt;Brand New&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;div id=&quot;vcResult&quot;&gt;&lt;/div&gt;
      ${fxTicker()}
    `, `&lt;button class=&quot;btn ghost&quot; data-close=&quot;1&quot;&gt;Close&lt;/button&gt;&lt;button class=&quot;btn&quot; data-run-valuecheck=&quot;1&quot;&gt;Check value&lt;/button&gt;`);
  }
  function runValueCheck(){
    const brand = ($(&quot;#vcBrand&quot;)||{}).value;
    const year = ($(&quot;#vcYear&quot;)||{}).value;
    const mileage = ($(&quot;#vcMileage&quot;)||{}).value;
    const condition = ($(&quot;#vcCondition&quot;)||{}).value;
    const est = estimateValue({brand,year,mileage,condition});
    const low = Math.round(est.ngn*0.93/50000)*50000, high = Math.round(est.ngn*1.07/50000)*50000;
    const box = $(&quot;#vcResult&quot;);
    if(box) box.innerHTML = `
      &lt;div class=&quot;card&quot; style=&quot;padding:14px;margin:10px 0;background:var(--grad-soft);border:none&quot;&gt;
        &lt;div class=&quot;fs12 muted&quot;&gt;Fair market range · ${esc(brand)} ${esc(String(year))}&lt;/div&gt;
        &lt;div class=&quot;vprice&quot; style=&quot;font-size:22px;margin-top:4px&quot;&gt;${money(low)} – ${money(high)}&lt;/div&gt;
        &lt;div class=&quot;fs12 muted&quot; style=&quot;margin-top:6px&quot;&gt;Based on global reference ~$${est.usd.toLocaleString()} at today&#x27;s rate ₦${Math.round(est.rate).toLocaleString()}/$, adjusted for age, mileage and condition.&lt;/div&gt;
      &lt;/div&gt;`;
  }

  function auctionCard(v,a){
    const ended = Date.now() &gt; a.endsAt;
    const pct = Math.max(0, 100 - Math.round((a.currentBid / v.marketValue)*100));

    const overpriced = v.marketValue &gt; fair.ngn*1.2;

          &lt;div class=&quot;card&quot; style=&quot;padding:18px&quot;&gt;

              &lt;div style=&quot;flex:1;min-width:0&quot;&gt;&lt;b class=&quot;fs14&quot;&gt;${esc(d.name)}&lt;/b&gt;&lt;div class=&quot;fs12 muted&quot;&gt;${stars(d.rating)} ${d.rating} · ${d.reviews} reviews&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

  /* ---------------- DEALER ---------------- */
  V.dealer = (id) =&gt; {
    const d = dealer(id) || DB.dealers[0];
    const inv = DB.vehicles.filter(v=&gt;v.dealerId===d.id);
    return shell(`${back(&quot;#/home&quot;)}
      &lt;div class=&quot;glass&quot; style=&quot;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap&quot;&gt;

        &lt;div style=&quot;flex:1;min-width:200px&quot;&gt;
          &lt;div class=&quot;row&quot;&gt;&lt;h1 style=&quot;font-size:22px&quot;&gt;${esc(d.name)}&lt;/h1&gt;${d.verified?`&lt;span class=&quot;badge ok&quot;&gt;✓ Verified&lt;/span&gt;`:&quot;&quot;}&lt;/div&gt;
          &lt;div class=&quot;row fs13 muted&quot; style=&quot;margin-top:4px;gap:6px&quot;&gt;&lt;span class=&quot;stars&quot;&gt;${stars(d.rating)}&lt;/span&gt;${d.rating} · ${d.reviews} reviews · ${d.city} · since ${d.since}&lt;/div&gt;

        &lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;#/chat/c1&quot;&gt;Message&lt;/button&gt;&lt;button class=&quot;btn ghost&quot; data-snack=&quot;Calling ${d.phone}&quot;&gt;Call&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;grid g4&quot; style=&quot;margin-top:14px&quot;&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span class=&quot;fs12 muted&quot;&gt;Inventory&lt;/span&gt;&lt;b&gt;${inv.length}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span class=&quot;fs12 muted&quot;&gt;Avg. response&lt;/span&gt;&lt;b&gt;8 min&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span class=&quot;fs12 muted&quot;&gt;Delivery&lt;/span&gt;&lt;b&gt;Free in Lagos&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;kpi&quot;&gt;&lt;span class=&quot;fs12 muted&quot;&gt;Hours&lt;/span&gt;&lt;b style=&quot;font-size:13px&quot;&gt;${d.hours}&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;padding:18px;margin-top:14px&quot;&gt;&lt;h3 style=&quot;font-size:16px&quot;&gt;Current promotion&lt;/h3&gt;&lt;p class=&quot;fs14 muted&quot; style=&quot;margin-top:6px&quot;&gt;🎁 ${d.promo}&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;map&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;pin&quot; style=&quot;left:46%;top:40%&quot;&gt;📍&lt;/div&gt;&lt;/div&gt;
      &lt;section class=&quot;sec&quot;&gt;&lt;div class=&quot;sec-head&quot;&gt;&lt;h3&gt;Inventory&lt;/h3&gt;&lt;span class=&quot;more&quot; data-go=&quot;#/browse&quot;&gt;All listings →&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;grid g3&quot;&gt;${inv.slice(0,9).map(v=&gt;vcard(v)).join(&quot;&quot;)}&lt;/div&gt;&lt;/section&gt;
      &lt;section class=&quot;sec card&quot; style=&quot;padding:18px&quot;&gt;&lt;h3 style=&quot;font-size:16px&quot;&gt;Dealer reviews&lt;/h3&gt;
        ${DB.reviews.slice(0,5).map(r=&gt;`&lt;div class=&quot;list-item&quot; style=&quot;cursor:default&quot;&gt;&lt;div class=&quot;av&quot;&gt;${r.initials}&lt;/div&gt;&lt;div style=&quot;flex:1&quot;&gt;
          &lt;div class=&quot;between&quot;&gt;&lt;b class=&quot;fs14&quot;&gt;${r.name}&lt;/b&gt;&lt;span class=&quot;fs12 muted&quot;&gt;${r.date}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;stars&quot;&gt;${stars(r.rating)}&lt;/div&gt;&lt;p class=&quot;fs13 muted&quot;&gt;${r.text}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/section&gt;
    `,&quot;search&quot;);
  };

  /* ---------------- FAVORITES / COMPARE / CART ---------------- */
  V.favorites = () =&gt; {
    const favs = S.favorites.map(veh).filter(Boolean);
    return shell(`${pageHead(&quot;Favorites&quot;,&quot;Saved vehicles, dealers, searches and alerts&quot;)}
      &lt;div class=&quot;seg&quot; style=&quot;margin-bottom:16px&quot;&gt;
        &lt;button class=&quot;on&quot;&gt;Vehicles (${favs.length})&lt;/button&gt;&lt;button data-snack=&quot;Saved dealers&quot;&gt;Dealers (3)&lt;/button&gt;
        &lt;button data-snack=&quot;Saved searches&quot;&gt;Searches (2)&lt;/button&gt;&lt;button data-snack=&quot;Alerts&quot;&gt;Alerts (4)&lt;/button&gt;&lt;/div&gt;
      ${favs.length ? `&lt;div class=&quot;grid g3&quot;&gt;${favs.map(v=&gt;vcard(v)).join(&quot;&quot;)}&lt;/div&gt;`
        : `&lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;big&quot;&gt;❤️&lt;/div&gt;&lt;h3&gt;No favorites yet&lt;/h3&gt;&lt;p class=&quot;fs14&quot;&gt;Tap the heart on any listing to save it here.&lt;/p&gt;&lt;button class=&quot;btn&quot; style=&quot;margin-top:14px&quot; data-go=&quot;#/browse&quot;&gt;Browse vehicles&lt;/button&gt;&lt;/div&gt;`}
      &lt;section class=&quot;sec grid g2&quot;&gt;
        &lt;div class=&quot;card&quot; style=&quot;padding:18px&quot;&gt;&lt;h3 style=&quot;font-size:16px&quot;&gt;Price alerts&lt;/h3&gt;
          ${favs.slice(0,3).map(v=&gt;`&lt;div class=&quot;between&quot; style=&quot;padding:10px 0;border-bottom:1px dashed var(--line)&quot;&gt;&lt;span class=&quot;fs13&quot;&gt;${esc(v.title)}&lt;/span&gt;&lt;span class=&quot;badge ok&quot;&gt;Alert on&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;)}
          &lt;button class=&quot;btn soft wide sm&quot; style=&quot;margin-top:10px&quot; data-snack=&quot;Price alert created&quot;&gt;Add price alert&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot; style=&quot;padding:18px&quot;&gt;&lt;h3 style=&quot;font-size:16px&quot;&gt;Saved searches&lt;/h3&gt;
          ${[[&quot;Electric SUV under ₦25M&quot;,&quot;18 new&quot;],[&quot;Brand New pickups in Abuja&quot;,&quot;6 new&quot;]].map(([t,n])=&gt;`&lt;div class=&quot;between&quot; style=&quot;padding:10px 0;border-bottom:1px dashed var(--line)&quot;&gt;&lt;span class=&quot;fs13&quot;&gt;${t}&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;${n}&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;)}

      &lt;/section&gt;
      ${S.compare.length?`&lt;div style=&quot;text-align:center;margin-top:20px&quot;&gt;&lt;button class=&quot;btn lg&quot; data-go=&quot;#/compare&quot;&gt;Compare ${S.compare.length} selected →&lt;/button&gt;&lt;/div&gt;`:&quot;&quot;}
    `,&quot;favorites&quot;);
  };

  V.compare = () =&gt; {
    const items = S.compare.map(veh).filter(Boolean);
    if(!items.length) return shell(`${pageHead(&quot;Compare&quot;,&quot;Up to 4 vehicles side by side&quot;)}
      &lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;big&quot;&gt;⇄&lt;/div&gt;&lt;h3&gt;Nothing to compare&lt;/h3&gt;&lt;p class=&quot;fs14&quot;&gt;Tap ⇄ on any vehicle card to add it.&lt;/p&gt;
      &lt;button class=&quot;btn&quot; style=&quot;margin-top:14px&quot; data-go=&quot;#/browse&quot;&gt;Find vehicles&lt;/button&gt;&lt;/div&gt;`,&quot;search&quot;);
    const rows = [
      [&quot;Price&quot;,v=&gt;money(v.price-v.discount)],[&quot;Monthly est.&quot;,v=&gt;money(v.monthly)+&quot;/mo&quot;],
      [&quot;Condition&quot;,v=&gt;v.condition],[&quot;Body&quot;,v=&gt;v.body],[&quot;Fuel&quot;,v=&gt;v.fuel],
      [&quot;Engine&quot;,v=&gt;v.engine],[&quot;Horsepower&quot;,v=&gt;v.hp+&quot; hp&quot;],[&quot;Drive&quot;,v=&gt;v.drive],
      [&quot;Transmission&quot;,v=&gt;v.transmission],[&quot;Mileage&quot;,v=&gt;v.mileage.toLocaleString()+&quot; km&quot;],
      [&quot;Consumption&quot;,v=&gt;v.mpg],[&quot;Seats&quot;,v=&gt;v.seats],[&quot;Safety&quot;,v=&gt;v.safety+&quot; ★&quot;],
      [&quot;Rating&quot;,v=&gt;v.rating+&quot; ★&quot;],[&quot;Warranty&quot;,v=&gt;v.warranty],[&quot;Location&quot;,v=&gt;v.location]

    return shell(`${pageHead(&quot;Compare vehicles&quot;,`${items.length} of 4 slots used`)}
      &lt;div style=&quot;overflow-x:auto&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:16px;min-width:${160+items.length*200}px&quot;&gt;
        &lt;div style=&quot;display:grid;grid-template-columns:160px repeat(${items.length},1fr);gap:12px;align-items:end&quot;&gt;
          &lt;div&gt;&lt;/div&gt;
          ${items.map(v=&gt;`&lt;div&gt;&lt;img src=&quot;${v.images[0]}&quot; style=&quot;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px&quot; alt=&quot;${esc(v.title)}&quot; /&gt;
            &lt;b class=&quot;fs14&quot; style=&quot;display:block;margin-top:6px&quot;&gt;${esc(v.title)}&lt;/b&gt;
            &lt;div class=&quot;row&quot; style=&quot;margin-top:6px;gap:6px&quot;&gt;&lt;button class=&quot;btn sm&quot; data-go=&quot;#/vehicle/${v.id}&quot;&gt;View&lt;/button&gt;&lt;button class=&quot;btn sm ghost&quot; data-cmp=&quot;${v.id}&quot;&gt;Remove&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}
        &lt;/div&gt;
        &lt;div style=&quot;margin-top:16px&quot;&gt;${rows.map(([k,fn],idx)=&gt;`&lt;div style=&quot;display:grid;grid-template-columns:160px repeat(${items.length},1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);background:${idx%2?&quot;transparent&quot;:&quot;var(--surface-2)&quot;};border-radius:8px&quot;&gt;
          &lt;span class=&quot;fs13 muted&quot; style=&quot;padding-left:8px&quot;&gt;${k}&lt;/span&gt;${items.map(v=&gt;`&lt;span class=&quot;fs13&quot; style=&quot;font-weight:600&quot;&gt;${fn(v)}&lt;/span&gt;`).join(&quot;&quot;)}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;
      &lt;/div&gt;&lt;/div&gt;
      &lt;div style=&quot;text-align:center;margin-top:18px&quot;&gt;&lt;button class=&quot;btn lg&quot; data-go=&quot;#/browse&quot;&gt;Add another vehicle&lt;/button&gt;&lt;/div&gt;
    `,&quot;search&quot;);
  };

  V.cart = () =&gt; {
    const items = S.cart.map(veh).filter(Boolean);
    const total = items.reduce((s,v)=&gt;s+v.price-v.discount,0);
    return shell(`${back(&quot;#/home&quot;)}${pageHead(&quot;Your cart&quot;,`${items.length} vehicle(s) reserved for 24 hours`)}
      ${items.length ? `&lt;div class=&quot;grid split&quot; style=&quot;gap:18px;align-items:start&quot;&gt;
        &lt;div class=&quot;grid&quot; style=&quot;gap:12px&quot;&gt;${items.map(v=&gt;`&lt;div class=&quot;card&quot; style=&quot;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap&quot;&gt;
          &lt;img src=&quot;${v.images[0]}&quot; style=&quot;width:130px;aspect-ratio:16/10;object-fit:cover;border-radius:10px&quot; alt=&quot;${esc(v.title)}&quot; /&gt;
          &lt;div style=&quot;flex:1;min-width:150px&quot;&gt;&lt;b class=&quot;fs14&quot;&gt;${esc(v.title)}&lt;/b&gt;&lt;div class=&quot;fs12 muted&quot;&gt;${v.location} · ${v.condition}&lt;/div&gt;

          &lt;h3 style=&quot;font-size:16px&quot;&gt;Summary&lt;/h3&gt;

          &lt;div class=&quot;spec-row&quot;&gt;&lt;span&gt;VAT (7.5%)&lt;/span&gt;&lt;span&gt;${money(total*0.075)}&lt;/span&gt;&lt;/div&gt;

          &lt;button class=&quot;btn wide lg&quot; style=&quot;margin-top:14px&quot; data-go=&quot;#/payment&quot;&gt;Checkout&lt;/button&gt;
          &lt;button class=&quot;btn wide ghost&quot; style=&quot;margin-top:10px&quot; data-go=&quot;#/browse&quot;&gt;Continue shopping&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`
        : `&lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;big&quot;&gt;🛒&lt;/div&gt;&lt;h3&gt;Your cart is empty&lt;/h3&gt;&lt;button class=&quot;btn&quot; style=&quot;margin-top:14px&quot; data-go=&quot;#/browse&quot;&gt;Browse vehicles&lt;/button&gt;&lt;/div&gt;`}
    `,&quot;home&quot;);
  };

  /* ---------------- FINANCING ---------------- */
  V.financing = () =&gt; {
    const L = S.loan;
    const p = L.price - L.down;
    const r = L.apr/100/12;
    const m = r ? (p*r)/(1-Math.pow(1+r,-L.term)) : p/L.term;
    const total = m*L.term + L.down;
    return shell(`${back(&quot;#/home&quot;)}${pageHead(&quot;Financing&quot;,&quot;Pre-qualify with a soft credit check — no score impact&quot;)}
      &lt;div class=&quot;grid split&quot; style=&quot;gap:18px;align-items:start&quot;&gt;
        &lt;div class=&quot;glass&quot; style=&quot;padding:20px&quot;&gt;
          &lt;h3 style=&quot;font-size:17px&quot;&gt;Loan calculator&lt;/h3&gt;
          &lt;div style=&quot;margin-top:14px&quot;&gt;
            &lt;div class=&quot;between&quot;&gt;&lt;label class=&quot;label&quot;&gt;Vehicle price&lt;/label&gt;&lt;b&gt;${money(L.price)}&lt;/b&gt;&lt;/div&gt;
            &lt;input class=&quot;slider&quot; type=&quot;range&quot; min=&quot;800000&quot; max=&quot;80000000&quot; step=&quot;100000&quot; value=&quot;${L.price}&quot; data-loan=&quot;price&quot; /&gt;
            &lt;div class=&quot;between&quot; style=&quot;margin-top:12px&quot;&gt;&lt;label class=&quot;label&quot;&gt;Down payment&lt;/label&gt;&lt;b&gt;${money(L.down)}&lt;/b&gt;&lt;/div&gt;

  /* ---------------- ROUTER ---------------- */
  function render(){
    const raw = (location.hash || &quot;#/splash&quot;).slice(2);
    const [route,a,b] = raw.split(&quot;/&quot;);
    let html;
    if(!route) html = V.splash();
    else if(route===&quot;welcome&quot;)  html = V.welcome(a);
    else if(route===&quot;vehicle&quot;)  html = V.vehicle(a,b);
    else if(route===&quot;dealer&quot;)   html = V.dealer(a);
    else if(route===&quot;chat&quot;)     html = V.chat(a);
    else if(route===&quot;booking&quot;)  html = V.booking(a);
    else if(route===&quot;auction&quot;)  html = V.auctionDetail(a);
    else if(V[route])           html = V[route]();
    else                        html = V.notfound();
    app.innerHTML = html;
    window.scrollTo({top:0,behavior:&quot;instant&quot;});
    if(route===&quot;splash&quot; || !route) setTimeout(()=&gt;{ if(location.hash.includes(&quot;splash&quot;)||!location.hash) go(&quot;#/welcome/0&quot;); },2000);
  }

  /* ---------------- events ---------------- */
  document.addEventListener(&quot;click&quot;,(e)=&gt;{
    // ripple
    if(e.target.closest(&quot;.btn&quot;)){
      const btn = e.target.closest(&quot;.btn&quot;);
      const r = document.createElement(&quot;span&quot;);
      const rect = btn.getBoundingClientRect();
      r.className = &quot;ripple&quot;;
      r.style.width = r.style.height = rect.width + &quot;px&quot;;
      r.style.left = e.clientX - rect.left - rect.width/2 + &quot;px&quot;;
      r.style.top  = e.clientY - rect.top  - rect.width/2 + &quot;px&quot;;
      btn.appendChild(r);
      setTimeout(()=&gt;r.remove(),620);
    }

    // close menu on any outside click
    const menuWrap = e.target.closest(&quot;.menu-wrap&quot;);
    if(S.menuOpen &amp;&amp; !menuWrap){ S.menuOpen = false; render(); return; }

    const t = e.target.closest(&quot;[data-go],[data-external],[data-fav],[data-cmp],[data-qv],[data-cart],[data-cart-remove],[data-snack],[data-theme-toggle],[data-set-theme],[data-chat-toggle],[data-menu-toggle],[data-menu-go],[data-brand],[data-quick],[data-view],[data-apply],[data-reset],[data-img],[data-city],[data-day],[data-time],[data-logout],[data-delete-account],[data-close],[data-home-search],[data-ai],[data-quickbid],[data-place-bid],[data-submit-auction],[data-value-check],[data-run-valuecheck]&quot;);
    if(!t) return;
    const d = t.dataset;

    if(d.close!==undefined &amp;&amp; (e.target===t || e.target.closest(&quot;.ibtn&quot;)===t)) return closeModal();
    if(d.fav){ e.stopPropagation(); return toggleFav(d.fav); }
    if(d.cmp){ e.stopPropagation(); return toggleCompare(d.cmp); }
    if(d.qv){ e.stopPropagation(); return quickView(d.qv); }
    if(d.cart){ e.stopPropagation(); return addCart(d.cart); }
    if(d.cartRemove){ S.cart = S.cart.filter(x=&gt;x!==d.cartRemove); save(&quot;cart&quot;,S.cart); return render(); }
    if(d.themeToggle!==undefined) return setTheme(S.theme===&quot;dark&quot;?&quot;light&quot;:&quot;dark&quot;);
    if(d.setTheme) return setTheme(d.setTheme);
    if(d.chatToggle!==undefined){ S.chatOpen = !S.chatOpen; return render(); }
    if(d.menuToggle!==undefined){ S.menuOpen = !S.menuOpen; return render(); }
    if(d.menuGo){
      if(d.menuGo === &quot;__theme__&quot;){ S.menuOpen=false; return setTheme(S.theme===&quot;dark&quot;?&quot;light&quot;:&quot;dark&quot;); }
      S.menuOpen = false; return go(d.menuGo);
    }
    if(d.ai){ snack(&quot;Assistant is thinking…&quot;); return; }
    if(d.brand){ S.filters = { ...S.filters, brand:d.brand, q:&quot;&quot; }; return go(&quot;#/search&quot;); }
    if(d.quick){
      const q = d.quick;
      S.filters = { ...S.filters, brand:&quot;&quot;, body:&quot;&quot;, fuel:&quot;&quot;, condition:&quot;&quot;, max:80_000_000, q:&quot;&quot; };
      if(q===&quot;Under ₦10M&quot;) S.filters.max = 10_000_000;
      if(q===&quot;Electric&quot;)   S.filters.fuel = &quot;Electric&quot;;
      if(q===&quot;SUV&quot;)        S.filters.body = &quot;SUV&quot;;
      if(q===&quot;Pickup&quot;)     S.filters.body = &quot;Pickup&quot;;
      if(q===&quot;Low mileage&quot;)S.filters.sort = &quot;mileage&quot;;
      if(q===&quot;Brand New&quot;)  S.filters.condition = &quot;Brand New&quot;;
      if(q===&quot;Innoson&quot;)    S.filters.brand = &quot;Innoson&quot;;
      return go(&quot;#/search&quot;);
    }
    if(d.homeSearch!==undefined){ S.filters.q = ($(&quot;#homeSearch&quot;)||{}).value||&quot;&quot;; return go(&quot;#/search&quot;); }
    if(d.view){ S.filters.view = d.view; return render(); }
    if(d.apply!==undefined){ S.filters.q = ($(&quot;#q&quot;)||{}).value||&quot;&quot;; return render(); }
    if(d.reset!==undefined){ S.filters = { q:&quot;&quot;, brand:&quot;&quot;, body:&quot;&quot;, fuel:&quot;&quot;, condition:&quot;&quot;, city:&quot;&quot;, min:0, max:80_000_000, sort:&quot;relevance&quot;, view:S.filters.view }; return render(); }
    if(d.img!==undefined){ const id = location.hash.split(&quot;/&quot;)[2]; return go(`#/vehicle/${id}/${d.img}`); }
    if(d.city){ S.user.city = d.city; save(&quot;user&quot;,S.user); snack(&quot;Location set to &quot;+d.city); return render(); }
    if(d.day || d.time){
      t.parentElement.querySelectorAll(&quot;.on&quot;).forEach(x=&gt;x.classList.remove(&quot;on&quot;));
      t.classList.add(&quot;on&quot;); return;
    }
    if(d.logout!==undefined){
      return modal(&quot;Log out?&quot;, `&lt;p class=&quot;fs14 muted&quot;&gt;You&#x27;ll need to sign in again to see your saved vehicles and orders.&lt;/p&gt;`,
        `&lt;button class=&quot;btn ghost&quot; data-close=&quot;1&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;btn&quot; style=&quot;background:var(--danger)&quot; onclick=&quot;window.fullBuyerLogout &amp;&amp; window.fullBuyerLogout();&quot;&gt;Log out&lt;/button&gt;`);
    }
    if(d.deleteAccount!==undefined){
      return modal(&quot;Delete account&quot;, `&lt;p class=&quot;fs14 muted&quot;&gt;This permanently removes your profile, orders and saved vehicles. This cannot be undone.&lt;/p&gt;
        &lt;div class=&quot;field&quot; style=&quot;margin-top:12px&quot;&gt;&lt;label class=&quot;label&quot;&gt;Type DELETE to confirm&lt;/label&gt;&lt;input class=&quot;input&quot; placeholder=&quot;DELETE&quot; /&gt;&lt;/div&gt;`,
        `&lt;button class=&quot;btn ghost&quot; data-close=&quot;1&quot;&gt;Keep account&lt;/button&gt;&lt;button class=&quot;btn&quot; style=&quot;background:var(--danger)&quot; data-snack=&quot;Account deletion scheduled&quot; data-close=&quot;1&quot;&gt;Delete&lt;/button&gt;`);
    }
    if(d.quickbid){ const inp=$(&quot;#bidAmount&quot;); if(inp) inp.value=d.quickbid; return; }
    if(d.placeBid){ const inp=$(&quot;#bidAmount&quot;); const amt=+((inp&amp;&amp;inp.value)||0); return placeBid(d.placeBid, amt); }
    if(d.submitAuction!==undefined){
      return submitAuctionListing({
        brand:($(&quot;#safBrand&quot;)||{}).value||&quot;&quot;, model:($(&quot;#safModel&quot;)||{}).value||&quot;&quot;,
        year:($(&quot;#safYear&quot;)||{}).value||&quot;&quot;, value:($(&quot;#safValue&quot;)||{}).value||&quot;&quot;,
        start:($(&quot;#safStart&quot;)||{}).value||&quot;&quot;, duration:($(&quot;#safDuration&quot;)||{}).value||&quot;48&quot;,
        reason:($(&quot;#safReason&quot;)||{}).value||&quot;Urgent sale&quot;
      });
    }
    if(d.valueCheck!==undefined) return openValueCheck();
    if(d.runValuecheck!==undefined) return runValueCheck();
    if(d.external){
      const url = (window.AktiveAuth)
