        &lt;select class=&quot;mlx-input&quot; id=&quot;mlxVeh&quot; onchange=&quot;mlxListSheet(this.value)&quot;&gt;
          ${pool.map(p=&gt;`&lt;option value=&quot;${p.id}&quot; ${p.id===listSel?&quot;selected&quot;:&quot;&quot;}&gt;${escape(p.title)} — ${money(p.price)}&lt;/option&gt;`).join(&quot;&quot;)}
        &lt;/select&gt;
        &lt;div class=&quot;mlx-label&quot;&gt;Ask price (must be below market ${money(market)})&lt;/div&gt;
        &lt;input class=&quot;mlx-input&quot; id=&quot;mlxAsk&quot; type=&quot;number&quot; step=&quot;50000&quot; value=&quot;${suggested}&quot; oninput=&quot;mlxAskHint(${market})&quot;/&gt;
        &lt;div id=&quot;mlxHint&quot; style=&quot;color:var(--positive);font-size:11.5px;font-weight:700;margin-top:6px&quot;&gt;
          ${((market-suggested)/market*100).toFixed(1)}% below standard value&lt;/div&gt;
        &lt;div class=&quot;mlx-label&quot;&gt;Listing tier&lt;/div&gt;
        &lt;div class=&quot;mlx-tier&quot;&gt;${Object.entries(TIERS).map(([k,t])=&gt;`
          &lt;div class=&quot;t ${k===listTier?&quot;on&quot;:&quot;&quot;}&quot; onclick=&quot;mlxTier(&#x27;${k}&#x27;)&quot;&gt;&lt;div class=&quot;n&quot;&gt;${t.n}&lt;/div&gt;
          &lt;div class=&quot;f&quot;&gt;${money(t.fee)} · ${t.days}d&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;
        &lt;div class=&quot;mlx-label&quot;&gt;Payment&lt;/div&gt;
        &lt;div style=&quot;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600&quot;&gt;
          &lt;span&gt;Wallet balance&lt;/span&gt;&lt;b style=&quot;color:var(--text)&quot;&gt;${money(state.wallet.balance)}&lt;/b&gt;&lt;/div&gt;
        &lt;button class=&quot;mlx-btn primary&quot; style=&quot;width:100%;margin-top:14px;padding:13px&quot; onclick=&quot;mlxPayList()&quot;&gt;
          Pay ${money(TIERS[listTier].fee)} &amp; publish lot&lt;/button&gt;
      &lt;/div&gt;`);
  };
  window.mlxTier = function(k){ listTier=k; mlxListSheet(listSel); };
  window.mlxAskHint = function(market){
    const a = +document.getElementById(&quot;mlxAsk&quot;).value || 0, h = document.getElementById(&quot;mlxHint&quot;);
    const pct = (market-a)/market*100;
    h.textContent = pct&gt;0 ? pct.toFixed(1)+&quot;% below standard value&quot; : &quot;Above market — lot must be priced below &quot;+money(market);
    h.style.color = pct&gt;0 ? &quot;var(--positive)&quot; : &quot;var(--danger)&quot;;
  };
  window.mlxPayList = function(){
    const v = byId(listSel); if(!v) return;
    const market = mv(v), ask = +document.getElementById(&quot;mlxAsk&quot;).value || 0, fee = TIERS[listTier].fee;
    if (ask &lt;= 0 || ask &gt;= market){ toast(&quot;Ask price must be below market value&quot;,&quot;warn&quot;); return; }
    if (state.wallet.balance &lt; fee){ toast(&quot;Insufficient wallet balance&quot;,&quot;warn&quot;); return; }
    state.wallet.balance -= fee;
    state.wallet.tx.unshift({ id:&quot;TX&quot;+Date.now().toString(36).toUpperCase(), label:&quot;Auction space listing — &quot;+v.title, amt:-fee, when:Date.now() });
    saveState();
    const lot = { id:&quot;LOT-&quot;+Math.floor(1000+Math.random()*8999), vid:v.id, ask, market, tier:listTier, fee,
      listedAt:Date.now(), endsAt:Date.now()+TIERS[listTier].days*864e5, bids:[], status:&quot;live&quot;,
      top:Math.round(ask*0.94/50000)*50000, seller:DEALER.name };
    space.unshift(lot); saveSpace(); closeSheet();
    toast(&quot;Lot published · &quot;+((market-ask)/market*100).toFixed(1)+&quot;% below market&quot;,&quot;success&quot;);
    navigate(&quot;lot/&quot;+lot.id);
  };

  /* --- Lot page: live bidding + history --- */
  function screenLot(){
    const l = lotById(param()); if(!l) return `&lt;div class=&quot;mlx-panel&quot; style=&quot;margin-top:20px&quot;&gt;Lot not found. &lt;span class=&quot;a&quot; onclick=&quot;navigate(&#x27;space&#x27;)&quot;&gt;Back to space&lt;/span&gt;&lt;/div&gt;`;
    const v = byId(l.vid) || {}; const save = (l.market-l.top)/l.market*100;
    const nextBid = l.top + Math.max(50000, Math.round(l.top*0.01/50000)*50000);
    const closed = l.endsAt&lt;=Date.now() || l.status!==&quot;live&quot;;
    return `
      &lt;div class=&quot;mlx-panel mlx-in&quot; style=&quot;padding:0;overflow:hidden&quot;&gt;
        &lt;div style=&quot;height:220px;background:#101115 center/cover url(&#x27;${photoOf(v)}&#x27;)&quot;&gt;&lt;/div&gt;
        &lt;div style=&quot;padding:14px&quot;&gt;
          &lt;div style=&quot;display:flex;gap:8px;flex-wrap:wrap;align-items:center&quot;&gt;
            &lt;span class=&quot;mlx-pill save&quot;&gt;${save&gt;0?save.toFixed(1)+&quot;% below market&quot;:&quot;At market&quot;}&lt;/span&gt;
            &lt;span class=&quot;mlx-pill gold&quot;&gt;${TIERS[l.tier].n} lot&lt;/span&gt;
            &lt;span class=&quot;mlx-pill ${closed?&quot;info&quot;:&quot;live&quot;}&quot;&gt;${closed?&quot;Closed&quot;:&quot;Live&quot;}&lt;/span&gt;
          &lt;/div&gt;
          &lt;h1 style=&quot;margin:10px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.025em&quot;&gt;${escape(v.title||&quot;Lot&quot;)}&lt;/h1&gt;
          &lt;div style=&quot;color:var(--muted);font-size:12px&quot;&gt;${l.id} · ${v.year} · ${kkm(v.km||0)} · ${escape(v.trans||&quot;Auto&quot;)} · ${escape(v.city||&quot;&quot;)} · Seller ${escape(l.seller)}&lt;/div&gt;
          &lt;div style=&quot;margin-top:6px&quot;&gt;${reputationCompactHtml()}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mlx-panel mlx-in&quot;&gt;
        &lt;div class=&quot;mlx-kv&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Current top bid&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--accent)&quot; data-top=&quot;${l.id}&quot;&gt;${money(l.top)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Standard value&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${money(l.market)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Buy-now ask&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${money(l.ask)}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Bids&lt;/div&gt;&lt;div class=&quot;v&quot; data-bc=&quot;${l.id}&quot;&gt;${l.bids.length}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Time left&lt;/div&gt;&lt;div class=&quot;v mlx-cd&quot; data-cd=&quot;${l.id}&quot;&gt;${closed?&quot;Ended&quot;:clock(l.endsAt-Date.now())}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;Listing fee paid&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${money(l.fee)}&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;mlx-label&quot; style=&quot;margin-top:14px&quot;&gt;Platform commission (5% if accepted)&lt;/div&gt;
        &lt;div class=&quot;mlx-kv&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;On current top bid&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${money(Math.round(l.top*AUCTION_COMMISSION_RATE))}&lt;/div&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;k&quot;&gt;You&#x27;d receive&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--positive)&quot;&gt;${money(l.top-Math.round(l.top*AUCTION_COMMISSION_RATE))}&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        ${l.status===&quot;sold&quot; ? `&lt;div class=&quot;mlx-panel&quot; style=&quot;margin:12px 0 0;padding:12px&quot;&gt;
            &lt;div class=&quot;spread&quot;&gt;&lt;span&gt;Sale price&lt;/span&gt;&lt;span class=&quot;num&quot;&gt;${money(l.saleGross)}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;spread&quot; style=&quot;margin-top:6px;color:var(--muted)&quot;&gt;&lt;span&gt;Platform fee (5%)&lt;/span&gt;&lt;span class=&quot;num&quot;&gt;−${money(l.commission)}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;spread&quot; style=&quot;margin-top:6px;font-weight:800&quot;&gt;&lt;span&gt;Net payout&lt;/span&gt;&lt;span class=&quot;num&quot; style=&quot;color:var(--positive)&quot;&gt;${money(l.saleNet)}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;` : &quot;&quot;}
        &lt;div style=&quot;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap&quot;&gt;
          &lt;button class=&quot;mlx-btn primary&quot; ${closed?&quot;disabled&quot;:&quot;&quot;} onclick=&quot;mlxBid(&#x27;${l.id}&#x27;)&quot;&gt;Bid ${money(nextBid)}&lt;/button&gt;
          &lt;button class=&quot;mlx-btn&quot; ${closed?&quot;disabled&quot;:&quot;&quot;} onclick=&quot;mlxCustomBid(&#x27;${l.id}&#x27;)&quot;&gt;Custom bid&lt;/button&gt;
          &lt;button class=&quot;mlx-btn&quot; ${closed?&quot;disabled&quot;:&quot;&quot;} onclick=&quot;mlxBuyNow(&#x27;${l.id}&#x27;)&quot;&gt;Buy now ${money(l.ask)}&lt;/button&gt;
          &lt;button class=&quot;mlx-btn ghost&quot; onclick=&quot;mlxCompare(&#x27;${l.vid}&#x27;,event)&quot;&gt;${cmp.includes(l.vid)?&quot;✓ In comparison&quot;:&quot;Compare&quot;}&lt;/button&gt;
          ${(closed &amp;&amp; l.status!==&quot;sold&quot; &amp;&amp; l.bids.length) ? `&lt;button class=&quot;mlx-btn primary&quot; onclick=&quot;mlxAcceptBid(&#x27;${l.id}&#x27;)&quot;&gt;Accept top bid ${money(l.top)}&lt;/button&gt;` : &quot;&quot;}
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mlx-sec&quot;&gt;&lt;h2&gt;Bid history&lt;/h2&gt;&lt;span class=&quot;a&quot;&gt;&lt;span class=&quot;mlx-live-dot&quot;&gt;&lt;/span&gt;Updating live&lt;/span&gt;&lt;/div&gt;
      &lt;div style=&quot;margin:0 18px 8px&quot; class=&quot;mlx-in&quot;&gt;&lt;div class=&quot;mlx-bids&quot; data-hist=&quot;${l.id}&quot;&gt;${bidsHtml(l)}&lt;/div&gt;&lt;/div&gt;`;
  }
  function bidsHtml(l){
    if (!l.bids.length) return `&lt;div class=&quot;b&quot;&gt;&lt;span class=&quot;who&quot; style=&quot;color:var(--muted)&quot;&gt;No bids yet — open the floor.&lt;/span&gt;&lt;/div&gt;`;
    return l.bids.slice().reverse().map((b,i)=&gt;`&lt;div class=&quot;b ${b.me?&quot;me&quot;:&quot;&quot;}&quot;&gt;
      &lt;span class=&quot;who&quot;&gt;${b.me?&quot;You&quot;:escape(b.who)}${i===0?` &lt;span class=&quot;mlx-pill save&quot; style=&quot;margin-left:6px&quot;&gt;Top&lt;/span&gt;`:&quot;&quot;}&lt;/span&gt;
      &lt;span class=&quot;amt&quot;&gt;${money(b.amt)}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;${relTime(b.at)}&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;);
  }
  window.mlxBuyNow = function(id){
    const l = lotById(id); if(!l) return;
    pushBid(l, { who:&quot;You&quot;, amt:l.ask, at:Date.now(), me:true });
    finalizeSale(l, l.ask);
    toast(`Purchased at ${money(l.ask)} · platform fee ${money(l.commission)} · you receive ${money(l.saleNet)}`,&quot;success&quot;);
    window.render();
  };
  /* Seller accepts the current top bid once the auction has ended */
  window.mlxAcceptBid = function(id){
    const l = lotById(id); if(!l || l.status===&quot;sold&quot; || !l.bids.length) return;
    finalizeSale(l, l.top);
    toast(`Bid accepted at ${money(l.top)} · platform fee ${money(l.commission)} · you receive ${money(l.saleNet)}`,&quot;success&quot;);
    window.render();
  };
  /* Shared close-out: 5% platform commission is deducted from the accepted
     price (Buy Now or an accepted top bid) — the ₦5,000 listing fee was
     already paid up front when the lot went live. */
  function finalizeSale(l, gross){
    l.status = &quot;sold&quot;; l.endsAt = Date.now(); l.soldAt = Date.now();
    l.saleGross = gross;
    l.commission = Math.round(gross * AUCTION_COMMISSION_RATE);
    l.saleNet = gross - l.commission;
    saveSpace();
    const v = byId(l.vid); if (v){ v.status = &quot;sold&quot;; v.price = gross; saveState(); }
  }
  window.mlxBid = function(id){
    const l = lotById(id); if(!l || l.endsAt&lt;=Date.now()) return;
    const amt = l.top + Math.max(50000, Math.round(l.top*0.01/50000)*50000);
    pushBid(l, { who:&quot;You&quot;, amt, at:Date.now(), me:true });
    toast(&quot;Bid placed at &quot;+money(amt),&quot;success&quot;);
  };
  window.mlxCustomBid = function(id){
    const l = lotById(id); if(!l) return;
    openSheet(`&lt;div class=&quot;sheet-head&quot;&gt;&lt;h3&gt;Place a bid — ${l.id}&lt;/h3&gt;&lt;span class=&quot;x&quot; onclick=&quot;closeSheet()&quot;&gt;✕&lt;/span&gt;&lt;/div&gt;
      &lt;div style=&quot;padding:4px 4px 18px&quot;&gt;
        &lt;div class=&quot;mlx-label&quot;&gt;Current top ${money(l.top)} · Market ${money(l.market)}&lt;/div&gt;
        &lt;input class=&quot;mlx-input&quot; id=&quot;mlxBidAmt&quot; type=&quot;number&quot; step=&quot;50000&quot; value=&quot;${l.top+100000}&quot;/&gt;
        &lt;button class=&quot;mlx-btn primary&quot; style=&quot;width:100%;margin-top:12px;padding:13px&quot; onclick=&quot;mlxCustomBidGo(&#x27;${id}&#x27;)&quot;&gt;Confirm bid&lt;/button&gt;
      &lt;/div&gt;`);
  };
  window.mlxCustomBidGo = function(id){
    const l = lotById(id), amt = +document.getElementById(&quot;mlxBidAmt&quot;).value;
    if (!l || !amt || amt &lt;= l.top){ toast(&quot;Bid must exceed the current top bid&quot;,&quot;warn&quot;); return; }
    pushBid(l, { who:&quot;You&quot;, amt, at:Date.now(), me:true }); closeSheet(); toast(&quot;Bid placed at &quot;+money(amt),&quot;success&quot;);
  };
  function pushBid(l, bid){
    l.bids.push(bid); l.top = bid.amt; saveSpace(); paintLive(true);
  }

  /* --- Live bid engine --- */
  function paintLive(flash){
    space.forEach(l=&gt;{
      if (l.endsAt&lt;=Date.now() &amp;&amp; l.status===&quot;live&quot;) l.status=&quot;ended&quot;;
      document.querySelectorAll(`[data-cd=&quot;${l.id}&quot;]`).forEach(e=&gt;{
        const left = l.endsAt-Date.now();
        e.textContent = clock(left); e.classList.toggle(&quot;urgent&quot;, left&gt;0 &amp;&amp; left&lt;60000);
      });
      const t = document.querySelector(`[data-top=&quot;${l.id}&quot;]`);
      if (t){ t.textContent = money(l.top); if (flash) { t.classList.remove(&quot;mlx-flash&quot;); void t.offsetWidth; t.classList.add(&quot;mlx-flash&quot;); } }
      const bc = document.querySelector(`[data-bc=&quot;${l.id}&quot;]`); if (bc) bc.textContent = l.bids.length;
      const h = document.querySelector(`[data-hist=&quot;${l.id}&quot;]`); if (h) h.innerHTML = bidsHtml(l);
    });
  }
  setInterval(()=&gt;{ if (!window.__akSuspended &amp;&amp; [&quot;space&quot;,&quot;lot&quot;].includes(currentRoute())) paintLive(false); }, 1000);
  setInterval(()=&gt;{
    if (window.__akSuspended) return;
    let changed = false;
    openLots().forEach(l=&gt;{
      if (Math.random() &lt; 0.28){
        const amt = l.top + Math.max(50000, Math.round(l.top*(0.008+Math.random()*0.02)/50000)*50000);
        l.bids.push({ who:BIDDERS[Math.floor(Math.random()*BIDDERS.length)], amt, at:Date.now(), me:false });
        l.top = amt; changed = true;
      }
    });
    if (changed){ saveSpace(); if ([&quot;space&quot;,&quot;lot&quot;].includes(currentRoute())) paintLive(true); }
  }, 4200);

  /* --- Comparison view --- */
  function screenCompare(){
    const vs = cmp.map(byId).filter(Boolean);
    if (vs.length&lt;2) return `&lt;div class=&quot;mlx-sec&quot;&gt;&lt;h2&gt;Compare vehicles&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;mlx-panel&quot;&gt;Add at least two vehicles from any listing card to compare specs, history and market delta.
      &lt;div style=&quot;margin-top:12px&quot;&gt;&lt;button class=&quot;mlx-btn primary&quot; onclick=&quot;navigate(&#x27;dealer&#x27;)&quot;&gt;Browse showroom&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
    const d = vs.map(v =&gt; window.mlDealRating ? window.mlDealRating(v) : {mv:mv(v),pct:0,label:&quot;Fair&quot;});
    const best = (arr, hi) =&gt; { const m = hi?Math.max(...arr):Math.min(...arr); return arr.map(x=&gt;x===m); };
    const rows = [
      [&quot;Price&quot;, vs.map(v=&gt;money(v.price)), best(vs.map(v=&gt;v.price), false)],
      [&quot;Standard market value&quot;, d.map(x=&gt;money(x.mv)), vs.map(()=&gt;false)],
      [&quot;Market delta&quot;, d.map(x=&gt;`${x.pct&gt;=0?&quot;−&quot;:&quot;+&quot;}${Math.abs(x.pct).toFixed(1)}% ${x.pct&gt;=0?&quot;below&quot;:&quot;above&quot;}`), best(d.map(x=&gt;x.pct), true)],
      [&quot;Year&quot;, vs.map(v=&gt;v.year), best(vs.map(v=&gt;+v.year), true)],
      [&quot;Mileage&quot;, vs.map(v=&gt;kkm(v.km)), best(vs.map(v=&gt;v.km), false)],
      [&quot;Body / transmission&quot;, vs.map(v=&gt;`${v.type} · ${v.trans}`), vs.map(()=&gt;false)],
      [&quot;Location&quot;, vs.map(v=&gt;v.city), vs.map(()=&gt;false)],
      [&quot;Status&quot;, vs.map(v=&gt;v.status), vs.map(()=&gt;false)],
      [&quot;Views&quot;, vs.map(v=&gt;(v.views||0).toLocaleString()), best(vs.map(v=&gt;v.views||0), true)]
    ];
    const ind = (cls,txt) =&gt; `&lt;span class=&quot;mlx-ind ${cls}&quot;&gt;&lt;i&gt;&lt;/i&gt;${txt}&lt;/span&gt;`;
    const histRows = [
      [&quot;Accident record&quot;, vs.map(v=&gt; (+v.year&gt;=2022) ? ind(&quot;ok&quot;,&quot;No reported accident&quot;) : ind(&quot;warn&quot;,&quot;1 minor claim&quot;))],
      [&quot;Title status&quot;, vs.map(()=&gt; ind(&quot;ok&quot;,&quot;Clean title&quot;))],
      [&quot;Service history&quot;, vs.map(v=&gt; v.km&lt;30000 ? ind(&quot;ok&quot;,&quot;Full main-dealer&quot;) : v.km&lt;60000 ? ind(&quot;warn&quot;,&quot;Partial history&quot;) : ind(&quot;bad&quot;,&quot;Sparse records&quot;))],
      [&quot;Previous owners&quot;, vs.map(v=&gt; ind(v.km&lt;30000?&quot;ok&quot;:&quot;warn&quot;, v.km&lt;30000?&quot;1 owner&quot;:&quot;2 owners&quot;))],
      [&quot;Inspection grade&quot;, vs.map(v=&gt; ind(v.km&lt;40000?&quot;ok&quot;:&quot;warn&quot;, (4.9-(v.km/100000)).toFixed(1)+&quot; / 5.0&quot;))]
    ];
    return `&lt;div class=&quot;mlx-sec&quot;&gt;&lt;h2&gt;Vehicle comparison&lt;/h2&gt;&lt;span class=&quot;a&quot; onclick=&quot;mlxClearCompare()&quot;&gt;Clear all&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;mlx-cmp-wrap mlx-in&quot;&gt;&lt;table class=&quot;mlx-cmp&quot;&gt;
        &lt;tr&gt;&lt;th&gt;&lt;/th&gt;${vs.map(v=&gt;`&lt;th&gt;&lt;div class=&quot;mlx-cmp-head&quot;&gt;&lt;div class=&quot;th&quot; style=&quot;background-image:url(&#x27;${photoOf(v)}&#x27;)&quot;&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div&gt;${escape(v.title)}&lt;/div&gt;&lt;div style=&quot;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px&quot;&gt;
          ${escape(v.id)} · &lt;span onclick=&quot;mlxCompare(&#x27;${v.id}&#x27;)&quot; style=&quot;color:var(--accent);cursor:pointer&quot;&gt;remove&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/th&gt;`).join(&quot;&quot;)}&lt;/tr&gt;
        ${rows.map(([k,vals,bs])=&gt;`&lt;tr&gt;&lt;td&gt;${k}&lt;/td&gt;${vals.map((x,i)=&gt;`&lt;td class=&quot;${bs[i]?&quot;best&quot;:&quot;&quot;}&quot;&gt;${x}&lt;/td&gt;`).join(&quot;&quot;)}&lt;/tr&gt;`).join(&quot;&quot;)}
        ${histRows.map(([k,vals])=&gt;`&lt;tr&gt;&lt;td&gt;${k}&lt;/td&gt;${vals.map(x=&gt;`&lt;td&gt;${x}&lt;/td&gt;`).join(&quot;&quot;)}&lt;/tr&gt;`).join(&quot;&quot;)}
        &lt;tr&gt;&lt;td&gt;Action&lt;/td&gt;${vs.map(v=&gt;`&lt;td&gt;&lt;button class=&quot;mlx-btn primary&quot; onclick=&quot;navigate(&#x27;detail/${v.id}&#x27;)&quot;&gt;Open&lt;/button&gt;&lt;/td&gt;`).join(&quot;&quot;)}&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;`;
  }
  window.mlxClearCompare = ()=&gt;{ cmp=[]; saveCmp(); window.render(); };

  /* --- Dealer dashboard: manage listings --- */
  let manageTab = &quot;active&quot;;
  window.mlxManageTab = t =&gt; { manageTab = t; window.render(); };
  function payoutOf(v){
    const soldLot = space.find(l=&gt;l.vid===v.id &amp;&amp; l.status===&quot;sold&quot;);
    if (soldLot){
      return { gross:soldLot.saleGross, fee:soldLot.commission, logistics:0, net:soldLot.saleNet, viaAuction:true };
    }
    const gross = v.price, fee = Math.round(gross*0.035), logistics = 85000;
    return { gross, fee, logistics, net: gross-fee-logistics, viaAuction:false };
  }
  function screenManage(){
    const all = state.vehicles;
    const buckets = {
      active: all.filter(v=&gt;v.status===&quot;available&quot;||v.status===&quot;pending&quot;),
      scheduled: all.filter(v=&gt;v.status===&quot;draft&quot;||v.status===&quot;reserved&quot;),
      sold: all.filter(v=&gt;v.status===&quot;sold&quot;)
    };
    const list = buckets[manageTab] || [];
    const soldGross = buckets.sold.reduce((s,v)=&gt;s+v.price,0);
    const pendingPayout = buckets.sold.reduce((s,v)=&gt;s+payoutOf(v).net,0);
    return heroHtml(false) + `
      &lt;div class=&quot;stats&quot;&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Active listings&lt;/div&gt;&lt;div class=&quot;value num&quot; data-count=&quot;${buckets.active.length}&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Published &amp; live&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Scheduled&lt;/div&gt;&lt;div class=&quot;value num&quot; data-count=&quot;${buckets.scheduled.length}&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Drafts &amp; reserved&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Sold (all time)&lt;/div&gt;&lt;div class=&quot;value num small&quot; data-count=&quot;${soldGross}&quot; data-fmt=&quot;ngn&quot;&gt;₦0&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Gross value&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Payouts due&lt;/div&gt;&lt;div class=&quot;value num small&quot; data-count=&quot;${pendingPayout}&quot; data-fmt=&quot;ngn&quot;&gt;₦0&lt;/div&gt;&lt;div class=&quot;delta&quot;&gt;Net of fees&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mlx-tabs&quot;&gt;
        ${[[&quot;active&quot;,&quot;Active&quot;],[&quot;scheduled&quot;,&quot;Scheduled&quot;],[&quot;sold&quot;,&quot;Sold &amp; payouts&quot;]].map(([k,n])=&gt;
          `&lt;button class=&quot;${manageTab===k?&quot;on&quot;:&quot;&quot;}&quot; onclick=&quot;mlxManageTab(&#x27;${k}&#x27;)&quot;&gt;${n} · ${buckets[k].length}&lt;/button&gt;`).join(&quot;&quot;)}
        &lt;button onclick=&quot;mlxListSheet()&quot;&gt;+ List on auction space&lt;/button&gt;
      &lt;/div&gt;
      ${list.length ? list.map(v=&gt;{
        const p = payoutOf(v), lot = space.find(l=&gt;l.vid===v.id &amp;&amp; l.status===&quot;live&quot;);
        const meta = manageTab===&quot;sold&quot;
          ? (p.viaAuction ? `Gross ${money(p.gross)} · platform fee (5%) ${money(p.fee)}` : `Gross ${money(p.gross)} · fee ${money(p.fee)} · logistics ${money(p.logistics)}`)
          : manageTab===&quot;scheduled&quot;
            ? `Goes live ${new Date(Date.now()+864e5*2).toLocaleDateString(&quot;en-NG&quot;,{month:&quot;short&quot;,day:&quot;numeric&quot;})} · ${escape(v.city)}`
            : `${(v.views||0).toLocaleString()} views · ${escape(v.city)}${lot?&quot; · in auction space&quot;:&quot;&quot;}`;
        const right = manageTab===&quot;sold&quot;
          ? `&lt;div class=&quot;p&quot; style=&quot;color:var(--positive)&quot;&gt;${money(p.net)}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Payout ${new Date(Date.now()+864e5*3).toLocaleDateString(&quot;en-NG&quot;,{month:&quot;short&quot;,day:&quot;numeric&quot;})}&lt;/div&gt;`
          : `&lt;div class=&quot;p&quot;&gt;${money(v.price)}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;mlx-pill ${v.status===&quot;available&quot;?&quot;save&quot;:v.status===&quot;pending&quot;?&quot;info&quot;:&quot;gold&quot;}&quot;&gt;${escape(v.status)}&lt;/span&gt;&lt;/div&gt;`;
        return `&lt;div class=&quot;mlx-row mlx-in&quot; onclick=&quot;navigate(&#x27;detail/${v.id}&#x27;)&quot;&gt;
          &lt;div class=&quot;th&quot; style=&quot;background-image:url(&#x27;${photoOf(v)}&#x27;)&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;i&quot;&gt;&lt;div class=&quot;t&quot;&gt;${escape(v.title)}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;${meta}&lt;/div&gt;
            &lt;div style=&quot;margin-top:7px;display:flex;gap:6px&quot;&gt;
              &lt;button class=&quot;mlx-btn&quot; onclick=&quot;event.stopPropagation();navigate(&#x27;detail/${v.id}&#x27;)&quot;&gt;Details&lt;/button&gt;
              ${manageTab!==&quot;sold&quot;?`&lt;button class=&quot;mlx-btn&quot; onclick=&quot;event.stopPropagation();mlxListSheet(&#x27;${v.id}&#x27;)&quot;&gt;${lot?&quot;Re-list&quot;:&quot;Auction space&quot;}&lt;/button&gt;`:
                `&lt;button class=&quot;mlx-btn&quot; onclick=&quot;event.stopPropagation();toast(&#x27;Payout statement exported&#x27;,&#x27;success&#x27;)&quot;&gt;Statement&lt;/button&gt;`}
            &lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;r&quot;&gt;${right}&lt;/div&gt;&lt;/div&gt;`;
      }).join(&quot;&quot;) : `&lt;div class=&quot;mlx-panel&quot;&gt;Nothing in this bucket yet.&lt;/div&gt;`}`;
  }

  /* --- Dashboard enhancement (hero + listings) --- */
  function enhanceDashboard(sc){
    const g = sc.querySelector(&quot;.greeting&quot;);
    const hero = document.createElement(&quot;div&quot;);
    hero.innerHTML = heroHtml(false);
    if (g) g.replaceWith(hero.firstElementChild); else sc.insertBefore(hero.firstElementChild, sc.firstChild);
    const live = state.vehicles.filter(v=&gt;v.status===&quot;available&quot;).slice(0,8);
    const lots = openLots().slice(0,4);
    const block = document.createElement(&quot;div&quot;);
    block.innerHTML = `
      &lt;div class=&quot;mlx-sec&quot;&gt;&lt;h2&gt;Your cars listed for sale&lt;/h2&gt;&lt;span class=&quot;a&quot; onclick=&quot;navigate(&#x27;manage&#x27;)&quot;&gt;Manage listings&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;mlx-grid&quot;&gt;${live.map(vehCard).join(&quot;&quot;) || `&lt;div class=&quot;mlx-panel&quot;&gt;No live listings.&lt;/div&gt;`}&lt;/div&gt;
      &lt;div class=&quot;mlx-sec&quot;&gt;&lt;h2&gt;Auction space&lt;/h2&gt;&lt;span class=&quot;a&quot; onclick=&quot;navigate(&#x27;space&#x27;)&quot;&gt;Open space&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;mlx-grid&quot;&gt;${lots.map(lotCard).join(&quot;&quot;) || `&lt;div class=&quot;mlx-panel&quot;&gt;No open lots.&lt;/div&gt;`}&lt;/div&gt;`;
    const feed = sc.querySelector(&quot;.feed&quot;);
    if (feed &amp;&amp; feed.parentNode) feed.parentNode.insertBefore(block, feed.previousElementSibling);
    else sc.appendChild(block);
  }

  /* ---------- navigation entries ---------- */
  function addNav(container, route, label, icon, pos){
    if (!container || container.querySelector(`[data-route=&quot;#/${route}&quot;]`)) return;
    const b = document.createElement(&quot;button&quot;);
    b.className = &quot;nav&quot;; b.dataset.route = &quot;#/&quot;+route; b.setAttribute(&quot;aria-label&quot;, label);
    b.innerHTML = icon + label;
    b.addEventListener(&quot;click&quot;, ()=&gt;{ location.hash = &quot;#/&quot;+route; });
    const nodes = container.querySelectorAll(&quot;[data-route]&quot;), ref = nodes[pos];
    ref ? container.insertBefore(b, ref) : container.appendChild(b);
    syncNavColumns();
  }
  /* Keep the bottom tab bar&#x27;s column count matched to however many tabs
     actually exist, so items never get squeezed to one side or clipped. */
  function syncNavColumns(){
    const bar = document.querySelector(&quot;.bottom&quot;);
    if (!bar) return;
    const count = bar.querySelectorAll(&quot;:scope &gt; [data-route]&quot;).length;
    bar.style.setProperty(&quot;--nav-count&quot;, String(count || 5));
  }
  const ICO = {
    space:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M3 10l9-6 9 6&quot;/&gt;&lt;path d=&quot;M5 10v9h14v-9&quot;/&gt;&lt;path d=&quot;M9 19v-5h6v5&quot;/&gt;&lt;/svg&gt;`,
    manage:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;3&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.5&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;3&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.5&quot;/&gt;&lt;rect x=&quot;3&quot; y=&quot;14&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.5&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;14&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;1.5&quot;/&gt;&lt;/svg&gt;`,
    cmp:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M12 3v18&quot;/&gt;&lt;path d=&quot;M6 8L3 14h6z&quot;/&gt;&lt;path d=&quot;M18 8l-3 6h6z&quot;/&gt;&lt;/svg&gt;`,
    inventory:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;4&quot; width=&quot;18&quot; height=&quot;6&quot; rx=&quot;1&quot;/&gt;&lt;rect x=&quot;3&quot; y=&quot;14&quot; width=&quot;18&quot; height=&quot;6&quot; rx=&quot;1&quot;/&gt;&lt;/svg&gt;`,
    wallet:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;2&quot; y=&quot;6&quot; width=&quot;20&quot; height=&quot;14&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M2 10h20&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;15&quot; r=&quot;1.2&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;`,
    profile:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;8&quot; r=&quot;4&quot;/&gt;&lt;path d=&quot;M4 21a8 8 0 0 1 16 0&quot;/&gt;&lt;/svg&gt;`
  };
  const side = document.querySelector(&quot;.sidebar-nav&quot;);
  // Desktop has room for every core section as a first-class nav item.
  addNav(side, &quot;inventory&quot;, &quot;Inventory&quot;, ICO.inventory, 2);
  addNav(side, &quot;space&quot;, &quot;Auctions&quot;, ICO.space, 3);
  addNav(side, &quot;manage&quot;, &quot;Listings&quot;, ICO.manage, 4);
  addNav(side, &quot;compare&quot;, &quot;Compare&quot;, ICO.cmp, 5);
  addNav(side, &quot;wallet&quot;, &quot;Wallet&quot;, ICO.wallet, 6);
  // Profile lives in the account dropdown menu only, not the primary nav.
  // Mobile keeps a compact tab bar: Dashboard, Leads, Auctions, Compare.
  addNav(document.querySelector(&quot;.bottom&quot;), &quot;space&quot;, &quot;Auctions&quot;, ICO.space, 3);
  addNav(document.querySelector(&quot;.bottom&quot;), &quot;compare&quot;, &quot;Compare&quot;, ICO.cmp, 4);

  /* ---------- router ---------- */
  const prev = window.render;
  const MINE = { dealer:screenDealer, space:screenSpace, lot:screenLot, compare:screenCompare, manage:screenManage };
  const SKMAP = { dealer:&quot;grid&quot;, space:&quot;grid&quot;, lot:&quot;lot&quot;, compare:&quot;compare&quot;, manage:&quot;manage&quot; };

  window.render = function(){
    const r = currentRoute(), sc = document.getElementById(&quot;screen&quot;);
    if (MINE[r]){
      setActiveNav(); updateNotifBadge();
      const fab = document.getElementById(&quot;fab&quot;); if (fab) fab.style.display = &quot;none&quot;;
      if (!seen[r]){
        sc.innerHTML = sk(SKMAP[r]); sc.scrollTop = 0;
        seen[r] = true; setTimeout(()=&gt;window.render(), 520); return;
      }
      sc.innerHTML = MINE[r]() + footer();
      sc.scrollTop = 0; animateCounts(sc); paintLive(false);
      return;
    }
    prev();
    try { if (r===&quot;dashboard&quot; &amp;&amp; !sc.querySelector(&quot;.mlx-sk&quot;)) enhanceDashboard(sc); } catch(e){}
    if (!sc.querySelector(&quot;.mlx-sk&quot;) &amp;&amp; !sc.querySelector(&quot;.mlx-foot&quot;)) sc.insertAdjacentHTML(&quot;beforeend&quot;, footer());
  };
  window.addEventListener(&quot;hashchange&quot;, ()=&gt;window.render());

  loadSpace();
  window.render();
})();
&lt;/script&gt;

  /* ================= DELIVERY / LOGISTICS TRACKING ================= */
  setInterval(()=&gt;{
    if (window.__akSuspended) return;

          {kind:s.step===STEPS.length-1?&quot;success&quot;:&quot;info&quot;, system:s.step===STEPS.length-1, toast:false, sound:false});

  window.MLZreassign = function(id){

  function shipCard(s){
    const v = vById(s.vid) || {title:&quot;Vehicle&quot;, photo:&quot;&quot;};

        &lt;div style=&quot;flex:1;min-width:0;&quot;&gt;
          &lt;b style=&quot;font-size:13.5px&quot;&gt;${s.id} · ${esc(v.title)}&lt;/b&gt;

      &lt;div class=&quot;mlz-steps&quot;&gt;
        ${STEPS.map((st,i)=&gt;`&lt;div class=&quot;mlz-step ${i&lt;s.step?&quot;done&quot;:i===s.step?&quot;now&quot;:&quot;&quot;}&quot;&gt;

          &lt;div class=&quot;txt&quot;&gt;&lt;b&gt;${st}&lt;/b&gt;&lt;div class=&quot;mlz-sub&quot;&gt;${(s.log.find(l=&gt;l.s===st)||{}).at ? new Date(s.log.find(l=&gt;l.s===st).at).toLocaleTimeString(&quot;en-NG&quot;,{hour:&quot;2-digit&quot;,minute:&quot;2-digit&quot;}) : &quot;—&quot;}&lt;/div&gt;&lt;/div&gt;

  function screenDelivery(){
    if (!can(&quot;logistics&quot;)) return deny(&quot;Delivery tracking is not enabled for your role.&quot;);

      &lt;div class=&quot;mlz-h&quot;&gt;&lt;div&gt;&lt;h1&gt;${t(&quot;delivery&quot;)} &amp; logistics&lt;/h1&gt;&lt;p&gt;Courier assignment, live status and ETA for every sold unit.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

  /* ================= SUPPORT / DISPUTE TICKETING ================= */
  window.MLZticket = function(){

    setTimeout(()=&gt;{
      tk.msgs.push({who:&quot;Aktivemotor Resolution Team&quot;, text:&quot;Thanks — a specialist is reviewing this. SLA: &quot;+(tk.pri===&quot;urgent&quot;?&quot;2 hours&quot;:tk.pri===&quot;high&quot;?&quot;8 hours&quot;:&quot;24 hours&quot;)+&quot;.&quot;, at:Date.now()});

      &lt;div class=&quot;mlz-grid mlz-g2&quot;&gt;

          &lt;div class=&quot;mlz-field&quot;&gt;&lt;label&gt;Details&lt;/label&gt;&lt;textarea class=&quot;mlz-in&quot; id=&quot;mlzTBody&quot; rows=&quot;4&quot; placeholder=&quot;What happened?&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;button class=&quot;mlz-btn primary&quot; style=&quot;width:100%&quot; onclick=&quot;MLZticket()&quot;&gt;Raise ticket&lt;/button&gt;
        &lt;/div&gt;
        &lt;div&gt;
          ${D.tickets.length ? D.tickets.map(tk=&gt;`&lt;div class=&quot;mlz-panel&quot; style=&quot;margin-bottom:12px;&quot;&gt;
            &lt;div style=&quot;display:flex;gap:8px;align-items:center;&quot;&gt;
              &lt;b style=&quot;font-size:13.5px;flex:1&quot;&gt;${tk.id} · ${esc(tk.subj)}&lt;/b&gt;

            &lt;/div&gt;
            &lt;div class=&quot;mlz-sub&quot;&gt;${esc(tk.cat)} · opened by ${esc(tk.opener)} · ${new Date(tk.at).toLocaleString(&quot;en-NG&quot;)}&lt;/div&gt;
            &lt;div class=&quot;mlz-feed&quot; style=&quot;max-height:150px;&quot;&gt;${tk.msgs.map(m=&gt;`&lt;div&gt;&lt;b&gt;${esc(m.who)}&lt;/b&gt;: ${esc(m.text)}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;

            &lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;) : `&lt;div class=&quot;mlz-panel mlz-sub&quot;&gt;No tickets raised.&lt;/div&gt;`}

  function deny(msg){

      &lt;button class=&quot;mlz-btn&quot; onclick=&quot;MLZsignOut()&quot;&gt;Switch account&lt;/button&gt;&lt;/div&gt;`;
  }

  /* ================= nav + router ================= */
  const ICO = {
    finance:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;&gt;&lt;path d=&quot;M12 1v22&quot;/&gt;&lt;path d=&quot;M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6&quot;/&gt;&lt;/svg&gt;`,
    live:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;&gt;&lt;path d=&quot;M3 21h18&quot;/&gt;&lt;path d=&quot;M6 17l6-12 6 12&quot;/&gt;&lt;path d=&quot;M9 13h6&quot;/&gt;&lt;/svg&gt;`,
    ship:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;rect x=&quot;1&quot; y=&quot;6&quot; width=&quot;13&quot; height=&quot;10&quot; rx=&quot;1.5&quot;/&gt;&lt;path d=&quot;M14 9h4l3 3v4h-7z&quot;/&gt;&lt;circle cx=&quot;6&quot; cy=&quot;18&quot; r=&quot;2&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;18&quot; r=&quot;2&quot;/&gt;&lt;/svg&gt;`,
    desk:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M4 20h16&quot;/&gt;&lt;path d=&quot;M6 16c3-6 6 2 9-4&quot;/&gt;&lt;path d=&quot;M14 4l6 6&quot;/&gt;&lt;/svg&gt;`,
    help:`&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M9.5 9a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.6&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;17&quot; r=&quot;0.6&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;`
  };
  function addNav(container, route, label, icon){
    if (!container || container.querySelector(`[data-route=&quot;#/${route}&quot;]`)) return;
    const b = document.createElement(&quot;button&quot;);
    b.className=&quot;nav&quot;; b.dataset.route=&quot;#/&quot;+route; b.setAttribute(&quot;aria-label&quot;,label);
    b.innerHTML = icon + label;
    b.addEventListener(&quot;click&quot;, ()=&gt;{ location.hash = &quot;#/&quot;+route; });
    container.appendChild(b);

  function buildNav(){
    const side = document.querySelector(&quot;.sidebar-nav&quot;);
    addNav(side,&quot;finance&quot;,t(&quot;finance&quot;),ICO.finance);
    addNav(side,&quot;live&quot;,t(&quot;live&quot;),ICO.live);
    addNav(side,&quot;desk&quot;,t(&quot;desk&quot;),ICO.desk);
    addNav(side,&quot;delivery&quot;,t(&quot;delivery&quot;),ICO.ship);

    const bar = document.querySelector(&quot;.bottom&quot;);
    addNav(bar,&quot;live&quot;,t(&quot;live&quot;),ICO.live);
    if (bar) bar.style.setProperty(&quot;--nav-count&quot;, String(bar.querySelectorAll(&quot;:scope &gt; [data-route]&quot;).length||5));

  buildNav();

  const MINE = { finance:screenFinance, live:screenLive, delivery:screenDelivery, desk:screenDesk, support:screenSupport };
  const prev = window.render;
  window.render = function(){
    const r = currentRoute(), sc = document.getElementById(&quot;screen&quot;);

      if (window.animateCounts) animateCounts(sc);
      if (r===&quot;live&quot;) paintClocks();
      return;
    }
    prev();
    /* role gates on existing screens */
    if ((r===&quot;wallet&quot; &amp;&amp; !can(&quot;payout&quot;)) || (r===&quot;add&quot; &amp;&amp; !can(&quot;list&quot;))){
      sc.innerHTML = deny(r===&quot;wallet&quot; ? &quot;Payouts and wallet access are owner/accounts only.&quot; : &quot;Only owners and sales executives can publish listings.&quot;);
    }
  };
  window.addEventListener(&quot;hashchange&quot;, ()=&gt;window.render());

  mountAuth();
  window.render();
})();
&lt;/script&gt;


&lt;script&gt;
/* --- AppShell bridge (injected) --- */
(function(){
  &quot;use strict&quot;;
  function send(msg){ try { parent &amp;&amp; parent.postMessage(Object.assign({__akshell:1}, msg), &quot;*&quot;); } catch(e){} }
  window.__akSend = send;
  window.__akSuspended = false;
  window.addEventListener(&quot;message&quot;, function(ev){
    var d = ev.data; if(!d || !d.__akshell) return;
    if(d.type === &quot;handoff&quot; &amp;&amp; d.session){
      try { localStorage.setItem(&quot;am_shared_session_v1&quot;, JSON.stringify(d.session)); } catch(e){}
      if(d.hash){ try { location.hash = d.hash; } catch(e){} }
    }
    if(d.type === &quot;suspend&quot;){
      window.__akSuspended = true;
    }
    if(d.type === &quot;resume&quot;){
      window.__akSuspended = false;
      try { if (window.render) window.render(); } catch(e){}
    }
  });
  /* announce ready */
  document.addEventListener(&quot;DOMContentLoaded&quot;, function(){ send({type:&quot;ready&quot;}); });
  /* intercept clicks that ask to cross apps: &lt;a data-akswitch=&quot;dealer&quot; href=&quot;#/xxx&quot;&gt; */
  document.addEventListener(&quot;click&quot;, function(e){
    var a = e.target &amp;&amp; e.target.closest &amp;&amp; e.target.closest(&quot;[data-akswitch]&quot;);
    if(!a) return;
    e.preventDefault();
    var mode = a.getAttribute(&quot;data-akswitch&quot;);
    var hash = a.getAttribute(&quot;href&quot;) || &quot;&quot;;
    var session = null;
    try { session = JSON.parse(localStorage.getItem(&quot;am_shared_session_v1&quot;)); } catch(_){}
    send({type:&quot;switch&quot;, mode:mode, hash:hash, session:session});
  }, true);
})();
&lt;/script&gt;

  var modeDD = document.getElementById("akModeDD");
  var modeChip = document.getElementById("akModeChip");
  var modeLabel = document.getElementById("akModeLabel");
  var modePanel = document.getElementById("akModePanel");
  var backToBuyer = document.getElementById("akBackToBuyer");
  var akbarEl = document.getElementById("akbar");
  var dragHandle = document.getElementById("akDragHandle");
  var modeNames = { buyer: "Buyer", dealer: "Dealer" };

  function closeDD(){
    modeDD.classList.remove("open");
    modeChip.setAttribute("aria-expanded", "false");
  }
  function openDD(){
    /* Flip the panel to whichever side actually has room, since the whole
       chip can now be dragged anywhere on screen (including hard against
       an edge), and a fixed left-aligned panel would otherwise clip off. */
    modePanel.style.left = "";
    modePanel.style.right = "";
    var r = modeDD.getBoundingClientRect();
    var panelW = modePanel.offsetWidth || 190;
    if(r.left + panelW > window.innerWidth - 8){
      modePanel.style.right = "0";
    } else {
      modePanel.style.left = "0";
    }
    modeDD.classList.add("open");
    modeChip.setAttribute("aria-expanded", "true");
  }
  modeChip.addEventListener("click", function(e){
    e.stopPropagation();
    if(modeDD.classList.contains("open")) closeDD(); else openDD();
  });
  document.addEventListener("click", function(e){
    if(!modeDD.contains(e.target)) closeDD();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeDD();
  });
  backToBuyer.addEventListener("click", function(){ setMode("buyer"); });

  /* ---------- drag-to-reposition ---------- */
  var DRAG_KEY = "am_shell_chip_pos_v1";
  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function placeAt(left, top){
    var w = akbarEl.offsetWidth, h = akbarEl.offsetHeight;
    left = clamp(left, 8, window.innerWidth - w - 8);
    top  = clamp(top, 8, window.innerHeight - h - 8);
    akbarEl.style.left = left + "px";
    akbarEl.style.top = top + "px";
    akbarEl.style.right = "auto";
  }
  (function restorePosition(){
    try {
      var saved = JSON.parse(localStorage.getItem(DRAG_KEY));
      if(saved && typeof saved.left === "number" && typeof saved.top === "number"){
        placeAt(saved.left, saved.top);
      }
    } catch(e){}
  })();
  window.addEventListener("resize", function(){
    var r = akbarEl.getBoundingClientRect();
    placeAt(r.left, r.top);
  });

  var dragState = null;
  dragHandle.addEventListener("pointerdown", function(e){
    e.preventDefault();
    closeDD();
    var r = akbarEl.getBoundingClientRect();
    dragState = { startX: e.clientX, startY: e.clientY, origLeft: r.left, origTop: r.top, moved: false };
    akbarEl.classList.add("dragging");
    /* Lock the chip to left/top coords for the duration of the drag,
       overriding its default top/right anchoring. */
    placeAt(r.left, r.top);
    try { dragHandle.setPointerCapture(e.pointerId); } catch(err){}
  });
  dragHandle.addEventListener("pointermove", function(e){
    if(!dragState) return;
    var dx = e.clientX - dragState.startX;
    var dy = e.clientY - dragState.startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) dragState.moved = true;
    placeAt(dragState.origLeft + dx, dragState.origTop + dy);
  });
  function endDrag(e){
    if(!dragState) return;
    akbarEl.classList.remove("dragging");
    var r = akbarEl.getBoundingClientRect();
    try { localStorage.setItem(DRAG_KEY, JSON.stringify({ left: r.left, top: r.top })); } catch(err){}
    dragState = null;
  }
  dragHandle.addEventListener("pointerup", endDrag);
  dragHandle.addEventListener("pointercancel", endDrag);

  /* Buyer ships inline in the page's initial HTML, so it's already loaded.
     Dealer is intentionally NOT loaded yet — its full document sits inertly
     in a data-srcdoc attribute until the person actually asks for it. This
     means on first paint the browser only ever parses/runs ONE app instead
     of two, and Dealer's timers/CSS never cost anything until needed. */
  frames.buyer.dataset.loaded = "1";

  function readSession(){
    try { return JSON.parse(localStorage.getItem("am_shared_session_v1")); } catch(_){ return null; }
  }
  function paintWho(){
    var s = readSession();
    who.textContent = s && (s.name || s.email || s.role) ? (s.name || s.email) + (s.role?(" · "+s.role):"") : "Guest";
  }
  function postToFrame(frame, msg){
    if(!frame || frame.dataset.loaded !== "1") return;
    try { frame.contentWindow.postMessage(Object.assign({__akshell:1}, msg), "*"); } catch(e){}
  }

  var akbar = document.getElementById("akbar");

  /* Makes `next` the visible/live pane. Only ever ONE iframe is display:block
     at a time (see CSS) so the inactive app is fully removed from layout,
     paint and compositing — not just hidden behind opacity. */
  function activateFrame(next, opts){
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle("active", k===next);
    });
    Object.keys(btns).forEach(function(k){
      btns[k].classList.toggle("active", k===next);
      btns[k].setAttribute("aria-checked", k===next ? "true" : "false");
    });
    modeLabel.textContent = modeNames[next];
    akbar.setAttribute("data-mode", next);
    closeDD();
    loading.classList.remove("show");
    postToFrame(frames[next], {type:"resume"});
    if(opts && (opts.hash || opts.session)){
      var target = frames[next];
      var send = function(){
        postToFrame(target, {
          type:"handoff",
          hash: opts.hash || "",
          session: opts.session || readSession()
        });
      };
      if(target.dataset.ready === "1") send();
      else target.addEventListener("load", function h(){ target.removeEventListener("load", h); send(); });
    }
    paintWho();
  }

  function setMode(next, opts){
    if(next !== "buyer" && next !== "dealer") return;
    if(mode === next && !(opts && (opts.hash || opts.session))) return;
    var prevMode = mode;
    mode = next;
    akbar.classList.add("switching");
    clearTimeout(akbar._switchT);
    akbar._switchT = setTimeout(function(){ akbar.classList.remove("switching"); }, 340);

    /* Tell the app we're leaving to pause its background work (auction
       ticks, live clocks, simulated-activity loops, etc.) right away. */
    postToFrame(frames[prevMode], {type:"suspend"});

    var target = frames[next];
    if(target.dataset.loaded !== "1"){
      /* First visit to this app this session: boot it now, not before. */
      loading.classList.add("show");
      target.addEventListener("load", function onFirstLoad(){
        target.removeEventListener("load", onFirstLoad);
        activateFrame(next, opts);
      });
      target.srcdoc = target.getAttribute("data-srcdoc");
      target.dataset.loaded = "1";
    } else {
      activateFrame(next, opts);
    }
  }

  btns.buyer.addEventListener("click", function(){ setMode("buyer"); });
  btns.dealer.addEventListener("click", function(){ setMode("dealer"); });

  /* Full reset: both apps' iframes share this page's origin (srcdoc with no
     sandbox), so their localStorage IS this page's localStorage — clearing it
     here reaches every key either app has ever written, including any we
     didn't inventory by name. We then hard-reload the whole shell rather than
     trying to reset each app in place: if either app is still loaded, its own
     background autosave loop (both apps periodically write their in-memory
     state back to localStorage) would just write the old data straight back
     into the storage we just cleared. A reload discards that in-memory state
     too, so nothing can resurrect itself. */
  var resetBtn = document.getElementById("akReset");
  resetBtn.addEventListener("click", function(){
    var ok = window.confirm("This clears all locally saved data (profile, listings, cart, watchlist, everything) in both Buyer and Dealer, and restarts as a fresh onboarding experience. Continue?");
    if(!ok) return;
    try { localStorage.clear(); } catch(e){}
    try { sessionStorage.clear(); } catch(e){}
    location.reload();
  });

  window.addEventListener("message", function(ev){
    var d = ev.data; if(!d || !d.__akshell) return;
    if(d.type === "ready"){
      /* mark whichever iframe sent it as ready */
      Object.keys(frames).forEach(function(k){
        if(frames[k].contentWindow === ev.source) frames[k].dataset.ready = "1";
      });
      paintWho();
    } else if(d.type === "switch"){
      setMode(d.mode, { hash: d.hash, session: d.session });
    }
  });

  paintWho();
  setInterval(paintWho, 1500);
})();
</script>
</body>
</html>
